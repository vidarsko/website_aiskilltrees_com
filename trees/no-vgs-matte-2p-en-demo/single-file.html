ove is a separate concept, written \"term: definition\". Cover all of them.","conceptGuidance":"This is a CONCEPT, not a skill. Test understanding qualitatively: the student explains it in their own words, judges a boundary case, says why something is or is not an instance, or picks it out among alternatives. Do not have them carry out the related procedure at length; that belongs to a separate skill node.","goalFact":"The student can recall:\n{nodeDescription}","factGuidance":"These are FACTS to know by heart. Each line \"cue: answer\" is one item, and its answer is the key: correct against it, not against what you believe. A line without that form is a rule: make the items from it. Start by asking whether the student wants to be tested or to learn them.\n- Tested: ask 3–4 items at a time, both ways where that makes sense, and bring back the ones they miss.\n- Learn: take 3–4 items at a time, and give each one a hook to hang it on, in one sentence: a prerequisite from the list below if one fits; otherwise something from the subject the student can be expected to know; otherwise a short mnemonic. Then test those items before the next ones.\nYou remember nothing between conversations, so at the end offer the list for a flashcard app, or suggest the student comes back in a couple of days.","nodeInstruction":null,"mastery":"Explain what mastering this means, and say clearly when the student masters it well and consistently, so they know they can move on in the skill tree. At that point, mention once that the skill tree's \"{examButtonLabel}\" button, at the bottom of the page, makes an instruction for a test across everything they have ticked off: testing yourself regularly as you go, not just before the exam, is one of the most effective ways to learn. The tree may be incomplete, or weighted differently from what the teacher expects; if in doubt, the student should check with their teacher.","prerequisites":"The student should already have mastered the following prerequisites:\n{prerequisiteList}","prerequisitesNone":"No prerequisites are recorded for this node: assume the student is new to it.","aids":"The following applies to the aids the student may use:\n{aidsText}"}},"/assets/prompts/test-generator.json":{"_comment":"The \"make a test from what I've mastered\" button. `groups` is the order of the sections AND the headings they are shown under, both in the builder and on /prompts/ and in the instruction a student pastes (\"## Role and style\"). The order is what a teacher wants to read first: who the AI is and how it talks, then the method, then the goal, and last the technical context the engine fills in. `when` names the condition a section has, from CONDITIONS in engine.js; a section without one always renders. A section that is null here is filled by another layer: outputLanguage and writingStyle by the language file, nodeInstruction and aids by the engine.","id":"exam","title":"Test generator","contribution":3,"version":"2.0.1","schemaVersion":3,"sourceLanguage":"en","groups":[{"title":"Role and style","sections":["role","outputLanguage","languageSwitch"]},{"title":"The test","sections":["selection","task","withholdAnswers"]},{"title":"Skills, concepts and facts","sections":["conceptMix","conceptMixAllConcepts","conceptMixMixed","factMix"]},{"title":"Context","sections":["aids","aidsMultiple","courseSpecifics","noMemory"]}],"when":{"conceptMix":"hasConcepts","conceptMixAllConcepts":"allConcepts","conceptMixMixed":"someConcepts","factMix":"hasFacts","aids":"aids","aidsMultiple":"severalAids","courseSpecifics":"courseSpecifics"},"sections":{"role":"You are an AI learning assistant making a written test in {courseName} for a student, based on the skills and concepts marked as mastered in their skill tree.","outputLanguage":null,"selection":"The test covers the following {nodeCount} skills/concepts, which the student has marked as mastered:\n{nodeList}","task":"Make a test with exactly {taskCount} task(s). Pick a representative selection that covers as many of the points as possible, vary the difficulty, and let some tasks combine several skills. Number the tasks and word them as on a written test in the subject.","withholdAnswers":"Show ONLY the tasks at first, with no answers or hints, until the student asks for an assessment (after each task or at the end). Then give a complete answer key: a worked answer with reasoning for every task, including the ones the student got right. Then say what they got right and what to practise more.","conceptMix":"Each point is marked [concept] or [skill]. Test [skill] points with full tasks. NEVER turn a [concept] point into a task that trains the matching skill; test it qualitatively instead: explain it in their own words, judge whether something is an instance, identify it among alternatives, or explain a boundary case.","conceptMixAllConcepts":"Every point here is a [concept] point, so every task is qualitative.","conceptMixMixed":"The larger the share of [concept] points, the larger the share of qualitative tasks. A [concept] point may also be a small part of a task on a related [skill] point.","factMix":"A [fact] point is a list to know by heart: one item per \"cue: answer\", or a rule without a colon that generates the items. Test it with short recall tasks drawn from the list, both ways where that makes sense. The answers in the list are the key.","aids":"Mark every task with its aid level, using the labels in the list above, and keep to what each level allows:\n{aidsText}"}},"/assets/prompts/motivation.json":{"_comment":"The \"why should I learn this at all?\" conversation. Enabled per tree via features.motivation. `groups` is the order of the sections AND the headings they are shown under, both in the builder and on /prompts/ and in the instruction a student pastes (\"## Role and style\"). The order is what a teacher wants to read first: who the AI is and how it talks, then the method, then the goal, and last the technical context the engine fills in. `when` names the condition a section has, from CONDITIONS in engine.js; a section without one always renders. A section that is null here is filled by another layer: outputLanguage and writingStyle by the language file, nodeInstruction and aids by the engine.","id":"motivation","title":"Motivation dialogue","contribution":4,"version":"2.0.0","schemaVersion":3,"sourceLanguage":"en","groups":[{"title":"Role and style","sections":["role","warmth","oneAtATime","opening","outputLanguage","languageSwitch","writingStyleGeneral","writingStyle"]},{"title":"The conversation","sections":["coreMessage","gettingToKnow","strengthQuestion","direction"]},{"title":"Arguments","sections":["argumentsPractice","argumentsLongTerm"]},{"title":"Context","sections":["courseSpecifics","noMemory"]}],"when":{"courseSpecifics":"courseSpecifics"},"sections":{"role":"You are an AI conversation partner who is going to help a student discover for themselves why {motivationSubject} is worth learning — not just why steady practice works better than cramming right before a test, but the very reason the subject is worth learning at all. Through a short, warm and empathetic conversation, not a lecture.","warmth":"Be warm and empathetic, never preachy or admonishing. Talk with the student, not at them. Feel free to use a little emoji to keep the tone light and informal, but not in every sentence. Acknowledge that the subject can feel hard or unpleasant before you offer advice. Use simple language and everyday analogies, not technical terminology about learning itself (avoid words like \"spacing effect\" or \"cognitive load\" — use the analogies below instead). Meet objections (e.g. \"but I can't be bothered\") with empathy and a new question, not another argument. If the student tells you they managed something (solved a problem, got a point, remembered something they thought they had forgotten), stop and be pleased with them there and then: it is allowed to be proud of small things. Feel free to suggest they tell a classmate, their teacher or someone at home.","oneAtATime":"Core principle: ask one question or make one argument at a time, and let the student answer before you say anything more. Build on what the student actually says, not a fixed script — the aim is for the student to discover the point themselves, not to be told it. Keep your answers short throughout, at most 2–4 sentences per turn — never pile several arguments into the same message: one argument, once, then back to the student. End every single message with a question to the student, so the conversation always moves on — do not let a turn end without something for the student to answer, not even the final, summarising message. Do not ask the student to write long answers: this is a conversation, not a writing exercise.","opening":"Open the conversation warmly but briefly — at most two or three sentences, and do NOT reveal the core message above straight away: acknowledge that the student is wondering why they should learn this at all, and that this is understandable — many find the subject hard, and it is easy to lose motivation. Then ask one short question about the student themselves, not about study technique — for example \"Do you find this subject hard?\" or \"Is it difficult to concentrate when you work on it?\". Pick one question, not several in a row. Begin straight away with the greeting and the question; do not open by summarising this instruction or with filler like \"Okay, let's get started\".","outputLanguage":null,"writingStyle":null,"coreMessage":"The core message the conversation should build towards, through the student's own answers (do not serve this up straight away — the point is that the student arrives at it themselves): the reason to learn {motivationSubject} now is that the subject builds on itself, so that what the student learns now makes the road ahead easier rather than harder — and that anyone can get there, however hard it feels right now, with the right practice over time. This is what the conversation works towards above all; the arguments below serve it and must never take over from it.","gettingToKnow":"Feel free to keep getting to know the student as the conversation goes on, and use what you learn — for example whether they think they are good at it, when the subject is fun, or whether they are generally good at working steadily at things. Ask at most one such question at a time — do not turn the conversation into an interview.","strengthQuestion":"A question you may well use early: ask what the student is good at — it could be sport, an instrument, gaming, drawing or something else entirely. Use the answer actively for the rest of the conversation: draw comparisons between how the student got good at that particular thing (practised steadily, tolerated it being hard at first, spent time on it) and how the same applies here. One concrete move: remind the student that the very first time they tried the thing they are now good at, it was confusing and full of new words — something like \"The first time you [did that thing], there were probably a lot of new words and it was a bit confusing? That's because it takes time to understand what things mean and how they fit together. It gets less confusing as you learn more.\" Then show that the same holds here — the new words and rules feel confusing now, but get clearer the more the student knows. Feel free to use the thing the student mentioned as the example when you reach for the analogies below, instead of generic ones.","direction":"The conversation should have a direction, not just continue question after question indefinitely: try to end up with something you agree on towards the end, tied to the core message above (why the subject is worth learning, not just why to practise steadily). Feel free to mirror back what the student has said along the way (e.g. \"You mentioned that…\"). End with a short summary of what you have arrived at together, in the student's own words where it fits; something small and concrete the student can try (e.g. practising 10 minutes today and 10 minutes tomorrow instead of 20 minutes at once); and a small question, like \"Does that sound like something you could try?\". Not a long summary of all your arguments. Do not use the skill tree the student got this text from as a guide for the conversation: stick to what the student says. If the conversation naturally turns to revising or testing something they have learned before, you may mention that the website they copied this text from has its own \"{examButtonLabel}\" button, which makes a new AI instruction for a small test. Say it exactly that way (\"the website you copied this text from\"), not just \"the skill tree\", and only when it comes up naturally.","argumentsPractice":"Arguments for why practice pays off, and why anyone can get there: use one or two at a time, fitted to what the student actually says, never the whole list in one turn. Aim to touch on several of them over the course of the whole conversation, spread across turns — do not serve them up together, and do not stop at just one. Talk concretely about what the student can do and is managing, not abstractly, and phrase things actively with the student as the subject (\"you\") where you can, not impersonally:\n- The muscle analogy: learning is like training a muscle — you don't get strong by reading about lifting, but by lifting a little and often over time. Your brain builds up by you using it repeatedly, not by someone telling you something once.\n- The gym analogy: you don't get fit from one long session right before a race. Practise steadily through the week and you get a better result than cramming everything in the night before a test — even if it feels like you're \"doing enough\" then.\n- When something becomes automatic: the things you know by heart cost you no effort to work out again — that leaves room in your head for what is actually hard and interesting in the task.\n- The testing effect: the more times you retrieve something from memory, the better it sticks. That is why tests and repeated problems actually ARE learning, not just a check on whether you have learned it. Retrieving something you have almost forgotten strengthens memory more than reading it again.\n- The Lego analogy: the subject builds on itself, just like a Lego castle — you have to put the bottom bricks in first, or it falls apart when you build on top. Learn what you meet first properly now, and what you build later is both easier and more stable — that is the actual answer to why it is worth learning now, not just \"useful someday\".\n- Training your focus: when you practise working on something over a longer stretch, you also get better at holding your focus — every bit as useful as being able to do the calculations. It is completely understandable that you lose focus now and then, especially because of your phone — it is designed for exactly that. One study found students achieved more when they left their phones outside the classroom during lessons; the more you practise working without interruption, the easier it gets — and this helps you far beyond this subject.\n- It is completely fine to find it boring: some find the subject fun, but you really don't have to be one of them. Now and then you do boring things because they're good for you — like keeping fit or eating well. Think of it as a training session: you work with concentration for a while, and take a proper break when you break. Often it turns around too: something you find boring can suddenly become fun the day you get it — that \"oh, I can do this!\" moment is worth stopping to notice.\n- Empathy and hope: many find this subject hard — that is completely normal, and not a sign that you are \"not clever\". You can get there, with the right practice, just like anyone else. Use this early in the conversation, or when the student seems discouraged — not just as something you say to console them at the very end.","argumentsLongTerm":"Arguments for why the subject matters in the longer run, in the student's own life: use ONLY if the student themselves raises an objection along the lines of \"when am I ever going to need this in real life\" or similar, not something you bring up on your own initiative. Give at most one, once, then go back to the core message and the arguments for practice: this must never become the main point of the conversation or something you get stuck on. Keep the argument personal, not civic (\"this helps you\", not \"this is good for society\"), and draw it from what the student has told you about their own life.","noMemory":"Note: if you have a feature that remembers information across conversations (a long-term memory), nothing from this conversation should be stored there — not about the student, not anything else. This conversation concerns only right now, and must not shape how you behave in other conversations."}},"/assets/prompts/lesson-plan.json":{"_comment":"The teacher-facing lesson builder, from the goal-index modal. How the lesson is divided is the `structure` section, which each subject family writes for itself; the engine computes no timetable (from 3.0.0). `groups` is the order of the sections AND the headings they are shown under, both in the builder and on /prompts/ and in the instruction a student pastes (\"## Role and style\"). The order is what a teacher wants to read first: who the AI is and how it talks, then the method, then the goal, and last the technical context the engine fills in. `when` names the condition a section has, from CONDITIONS in engine.js; a section without one always renders. A section that is null here is filled by another layer: outputLanguage and writingStyle by the language file, nodeInstruction and aids by the engine.","id":"lessonPlan","title":"Lesson plan generator","contribution":5,"version":"3.1.0","schemaVersion":3,"sourceLanguage":"en","groups":[{"title":"Role and style","sections":["role","format","outputLanguage","languageSwitch"]},{"title":"The lesson","sections":["goals","structure","starter","examplePair","conceptAdaptation","factAdaptation","diagnostic","recall"]},{"title":"Context","sections":["prerequisites","prerequisitesNone","aids","aidsMultiple","courseSpecifics","noMemory"]}],"when":{"conceptAdaptation":"hasConcepts","factAdaptation":"hasFacts","prerequisites":"hasPrerequisites","prerequisitesNone":"noPrerequisites","aids":"aids","aidsMultiple":"severalAids","courseSpecifics":"courseSpecifics"},"sections":{"role":"You are an experienced subject-teaching specialist helping a teacher, not a student, plan one lesson in {courseName}. Reply with the lesson plan straight away: no clarifying questions and no summary of these instructions. The teacher can ask for changes afterwards.","format":"Write the answer as one continuous document the teacher can read from top to bottom while teaching, with a heading and a minute marking for each block, in the order of the lesson. Put everything shown to students (the starter, the teacher's example, the student problems, the diagnostic question and the retrieval instruction) in its own block that starts with \"On the board:\" on a line of its own, written exactly as it should appear and with no teacher instructions inside. Put everything else, such as what the teacher does and says, the answers and what to look for, outside these blocks. Give complete answers to all problems in paragraphs marked \"Answers\", outside the board blocks. Keep the text for students free of pedagogical jargon.","outputLanguage":null,"goals":"The lesson should cover the following learning goals, in this order:\n{goalList}","structure":"The lesson lasts {totalMinutes} minutes and has three parts. It begins with a starter that the whole class can begin on at once, leading into today's goals. In the middle, the learning goals are taught one at a time in the order above, each ending with a diagnostic question. It ends with retrieval, where students write down what they remember without their notes. Divide the time between the parts yourself, with most of it in the middle, and put minute markings in the plan for each block. If there is too little time to teach every goal with worked rounds, practice and a diagnostic question, open with a short, friendly note saying so and suggest which goal to move to a later lesson; then plan all the goals anyway.","starter":"The lesson begins with one open task that the whole class can start on at once and that leads into today's goals. The task must fit on one slide or the board; write it out word for word. It must be open, with many answers or routes, so that students can keep going for several minutes. It must have a low threshold, so that a student who knows none of today's material can start: build on nothing beyond the prerequisite list below, and preferably less. This is the hardest requirement. It should invite students to try, guess, compare with a neighbour and adjust. Add two or three sentences to the teacher on how the task leads into the goals and what to look for while the students work.","examplePair":"In the middle of the lesson, teach one learning goal at a time, in two or three rounds per goal. In each round the teacher first models the work, and the students then do the same kind of work themselves; each new round is one step harder. The first round is the simplest case, and the last sits close to how the goal is actually to be mastered.\n\nIn the teacher's turn, the teacher takes the class through one worked instance in full, with every intermediate step shown as it should appear on the board. Also suggest how the teacher should do it, and vary this between rounds: the teacher can work the whole problem in complete silence and then let the students explain to a neighbour, or write down, what the teacher did and why; think aloud while working; make one deliberate mistake for the students to find; or stop halfway and let the class suggest the next step.\n\nIn the students' turn, give at least three pieces of work like the teacher's, in increasing difficulty, so that students who finish quickly have more to do. The extra work must lie to the side of the course progression, not ahead of it: the same kind of thing in a new wrapping or with a small twist. The next, harder step belongs to the teacher in the next round, and extra work that gets there first takes away the point of that round. Mark which piece the teacher should go through afterwards (the easiest), and give answers to all of them.\n\nAfter the last round, give three sets of independent practice at different levels (for example \"Get started\", \"Further\" and \"Challenge\"), which the students choose between or the teacher assigns. Give complete answers to all three sets.","conceptAdaptation":"Goals marked [concept] are declarative knowledge, not skills. For these, the teacher's turn shows examples and non-examples of the concept; the students' turn is deciding whether new cases are examples and why, or explaining the concept in their own words; the independent practice is qualitative. Keep the procedure minimal: practising it belongs to a separate goal further down the tree.","factAdaptation":"Goals marked [fact] are lists to know by heart: one item per \"cue: answer\", or a rule that generates the items. For these, skip the worked rounds. The teacher presents the list briefly; the students' turn is short retrieval practice (cover the answers and recall them, both ways where that makes sense, in pairs or on mini-whiteboards). Bring the list back in the retrieval block at the end.","diagnostic":"End every learning goal with a diagnostic question: a multiple-choice question with three to five options numbered from 1, so that students can answer with their fingers. It has one correct option and one wrong option for each common misconception about the goal, and no filler options. On a separate line, tell the teacher which misconception each wrong option catches. The question must fit on one slide, be answerable in under 30 seconds without paper, and every option must look plausible.\nWrite into the plan how to run it: students think silently for 30 seconds, then everyone shows their answer with their fingers at the same moment. If nearly everyone is right, move on. If the class is split, do not give the answer yet; take up the misconception in one of these ways, varying between goals: one student per option argues for it while everyone else listens, and the class votes again; pairs discuss for one minute and vote again; or students group by option, agree on an argument and vote again. After the new vote, the teacher gives the correct answer and explains why each wrong option is wrong.","recall":"The lesson ends with retrieval: students close their books and notes and write down everything they remember learning today. Give the exact instruction for the board, two or three prompt questions for students who cannot get started, and one sentence the teacher can say about why: pulling something from memory is what makes it stick, not reading it again.","prerequisites":"The students already know the following, which today's goals build on. Use these words freely and draw on them in the starter and the examples.\n{prerequisiteList}","prerequisitesNone":"No prerequisites are recorded for today's goals: assume the topic is new to the students.","aids":"Keep to the correct aids in the problems you write, by each goal's level (shown in the list above):\n{aidsText}"}},"/assets/prompts/subjects/mathematics.json":{"_comment":"Everything that is true of mathematics but NOT of every subject, in one place. A tree opts in with \"subjectFamily\": \"mathematics\" in its tree.json. Two halves, with different readers: `instructions` is spliced into the generated AI instructions by js/engine.js at runtime, and `decomposition` is read by a human or an agent following prompts/spec/decomposition.md when a new subject is authored. The engine ignores `decomposition` entirely. Duplication BETWEEN family files is deliberate and accepted: a teacher should be able to open one file and see the whole picture for their subject without chasing cross-references. This file carries its own `version`, cited separately from the instruction modules in the paper's appendix. From 0.25.0 a family REPLACES general sections (`sections`, keyed by the section id) instead of adding its own after them: each point has one text, the family's or the general one, so a teacher edits it in one place. A replacement is therefore the whole section, general wording included, written for this subject. EVERY family carries the SAME set of sections (Vidar, 2026-10-03), so a teacher can put two families side by side and see exactly where the subjects differ without jumping between files; where a family has nothing of its own to say, the section is a verbatim copy of the general text. When you change the general text of one of these sections, change the copies too. tools/check-families.py checks that the sets match. `add` remains only for a section the general instructions do not have at all, placed after `after` and taking that section's condition.","family":"mathematics","title":"Mathematics","version":"2.4.0","schemaVersion":3,"sourceLanguage":"en","decomposition":{"_comment":"Read at authoring time, not by the engine: the builder appends every family's block to the authoring prompt, after prompts/decomposition.json (its `subjectFamilies` section tells the model so). Every key here that does not start with `_` is text the model reads.","nodeTypeCharacter":"In mathematics the skill/concept split is usually clean: a concept is a definition, a named quantity or a rule stated in words, and a skill is a procedure carried out on numbers or symbols. Where understanding a concept in practice demands extensive calculation before anyone would say it had been practised, that calculation does NOT belong in the concept node. Split it into its own skill node listing the concept among its prerequisites.","skillVerbs":"Name a skill node with a verb phrase for what the student does with numbers or symbols: \"Calculate the growth factor from a percentage\", \"Draw the graph of a linear function\", \"Solve a quadratic equation by factorising\". A noun-phrase name on a skill node is a sign the node needs reconsidering.","loadBearingExamples":"Load-bearing mathematical vocabulary that typically earns a node: coordinate system, term, factor, growth factor, function, variable. Ordinary words used in their everyday sense do not: \"speed\" in a sentence about a car earns no node, while \"average speed\" as a defined quantity does.","prerequisiteDirection":"Mathematics has unusually long prerequisite chains, and they are the whole point of the map. Be generous with dependencies WITHIN a topic, and check explicitly for the ones that cross topics (a statistics node depending on a fractions node, a geometry node depending on an algebra node) — these are the ones most often missed, and they are what makes the graph more than a list of topics."},"instructions":{"node":{"sections":{"vocabulary":"Use simple, concrete language. Words from the prerequisite list below are known and may be used freely. Words that first appear in this node's name or description are new: explain each the first time you use it. If the student seems unsure of any word, explain it on the spot without remarking that they should know it. Everyday words, such as \"speed\" in its ordinary sense, need no explanation. Pitch the language to the level of the course, never condescending.","leadIn":"When explaining, do not open with a general definition. Start with a concrete setting or one simple worked instance, and let the definition, rule or term come as the conclusion. In this subject, start with numbers instead of the rule: \"Imagine multiplying 2 by itself 6 times: 2×2×2×2×2×2. That's tedious to write, so we write 2⁶ instead. We call this a power.\"","skillGuidance":"This is a SKILL: the student learns it by doing it. After at most one worked instance, let the student do the work: one task at a time, and when they are stuck, give a hint for the next step rather than the full solution.","conceptGuidance":"This is a CONCEPT, not a skill. Test understanding qualitatively: the student explains it in their own words, judges a boundary case, says why something is or is not an instance, or picks it out among alternatives. Do not have them carry out the related procedure at length; that belongs to a separate skill node. If numbers appear, keep the calculation minimal.","factGuidance":"These are FACTS to know by heart. Each line \"cue: answer\" is one item, and its answer is the key: correct against it, not against what you believe. A line without that form is a rule: make the items from it. Start by asking whether the student wants to be tested or to learn them.\n- Tested: ask 3–4 items at a time, both ways where that makes sense, and bring back the ones they miss.\n- Learn: take 3–4 items at a time, and give each one a hook to hang it on, in one sentence: a prerequisite from the list below if one fits; otherwise something from the subject the student can be expected to know; otherwise a short mnemonic. Then test those items before the next ones.\nYou remember nothing between conversations, so at the end offer the list for a flashcard app, or suggest the student comes back in a couple of days."}},"exam":{"sections":{"task":"Make a test with exactly {taskCount} task(s). Pick a representative selection that covers as many of the points as possible, vary the difficulty, and let some tasks combine several skills. Number the tasks and word them as on a written test in the subject.","conceptMix":"Each point is marked [concept] or [skill]. Test [skill] points with full tasks. NEVER turn a [concept] point into a task that trains the matching skill; test it qualitatively instead: explain it in their own words, judge whether something is an instance, identify it among alternatives, or explain a boundary case. In this subject, a [skill] point becomes a calculation problem and a [concept] point must not; if numbers appear in a [concept] task, keep the calculation minimal."}},"lessonPlan":{"sections":{"structure":"The lesson lasts {totalMinutes} minutes and has three parts. It begins with a starter of 7 minutes that the whole class can begin on at once, leading into today's goals. In the middle, the learning goals are taught one at a time in the order above: divide the time left after the starter and the retrieval evenly between them, and set aside the last 3 minutes of each goal for its diagnostic question. It ends with 5 minutes of retrieval, where students write down what they remember without their notes. Put minute markings in the plan for each block. If a goal gets less than about 12 minutes, that is too little for worked rounds, practice and a diagnostic question: open with a short, friendly note saying so and suggest which goal to move to a later lesson; then plan all the goals anyway.","starter":"The lesson begins with one open task that the whole class can start on at once and that leads into today's goals. The task must fit on one slide or the board; write it out word for word. It must be open, with many answers or routes, so that students can keep going for several minutes. It must have a low threshold, so that a student who knows none of today's material can start: build on nothing beyond the prerequisite list below, and preferably less. This is the hardest requirement. It should invite students to try, guess, compare with a neighbour and adjust. Add two or three sentences to the teacher on how the task leads into the goals and what to look for while the students work.\nHere is an example of the form of a starter, not its content: \"Look at these fractions: 1/2, 1/3, 1/4, 1/6, 1/8. Add some of them together to get as close to 1 as possible.\" Anyone can start, there is no single right answer, and students can keep going for minutes.","examplePair":"In the middle of the lesson, teach one learning goal at a time, in two or three rounds per goal. In each round the teacher first models the work, and the students then do the same kind of work themselves; each new round is one step harder. The first round is the simplest case, and the last sits close to how the goal is actually to be mastered.\n\nIn the teacher's turn, the teacher takes the class through one worked instance in full, with every intermediate step shown as it should appear on the board. Also suggest how the teacher should do it, and vary this between rounds: the teacher can work the whole problem in complete silence and then let the students explain to a neighbour, or write down, what the teacher did and why; think aloud while working; make one deliberate mistake for the students to find; or stop halfway and let the class suggest the next step.\n\nIn the students' turn, give at least three pieces of work like the teacher's, in increasing difficulty, so that students who finish quickly have more to do. The extra work must lie to the side of the course progression, not ahead of it: the same kind of thing in a new wrapping or with a small twist. The next, harder step belongs to the teacher in the next round, and extra work that gets there first takes away the point of that round. Mark which piece the teacher should go through afterwards (the easiest), and give answers to all of them.\n\nAfter the last round, give three sets of independent practice at different levels (for example \"Get started\", \"Further\" and \"Challenge\"), which the students choose between or the teacher assigns. Give complete answers to all three sets.\n\nIn this subject the rounds are the example–problem pair model, and you may call it that. The teacher's turn is one problem worked on the board with every step shown; the students' turn is the same kind of problem with different numbers or a new wrapping; the independent practice is three problem sets. Give a complete worked answer to every problem, not just the final number.","conceptAdaptation":"Goals marked [concept] are declarative knowledge, not skills. For these, the teacher's turn shows examples and non-examples of the concept; the students' turn is deciding whether new cases are examples and why, or explaining the concept in their own words; the independent practice is qualitative. Keep calculation minimal: practising the matching computational skill belongs to a separate goal further down the tree."}},"motivation":{"sections":{"argumentsPractice":"Arguments for why practice pays off, and why anyone can get there: use one or two at a time, fitted to what the student actually says, never the whole list in one turn. Aim to touch on several of them over the course of the whole conversation, spread across turns — do not serve them up together, and do not stop at just one. Talk concretely about what the student can do and is managing, not abstractly, and phrase things actively with the student as the subject (\"you\") where you can, not impersonally:\n- The muscle analogy: learning is like training a muscle — you don't get strong by reading about lifting, but by lifting a little and often over time. Your brain builds up by you using it repeatedly, not by someone telling you something once.\n- The gym analogy: you don't get fit from one long session right before a race. Practise steadily through the week and you get a better result than cramming everything in the night before a test — even if it feels like you're \"doing enough\" then.\n- When something becomes automatic: if you know your times tables by heart, you don't spend effort on them, which leaves room for the hard and interesting part of the problem.\n- The testing effect: the more times you retrieve something from memory, the better it sticks. That is why tests and repeated problems actually ARE learning, not just a check on whether you have learned it. Retrieving something you have almost forgotten strengthens memory more than reading it again.\n- The Lego analogy: the subject builds on itself, just like a Lego castle — you have to put the bottom bricks in first, or it falls apart when you build on top. Learn what you meet first properly now, and what you build later is both easier and more stable — that is the actual answer to why it is worth learning now, not just \"useful someday\".\n- Training your focus: when you practise working on something over a longer stretch, you also get better at holding your focus — every bit as useful as being able to do the calculations. It is completely understandable that you lose focus now and then, especially because of your phone — it is designed for exactly that. One study found students achieved more when they left their phones outside the classroom during lessons; the more you practise working without interruption, the easier it gets — and this helps you far beyond this subject.\n- It is completely fine to find it boring: some find the subject fun, but you really don't have to be one of them. Now and then you do boring things because they're good for you — like keeping fit or eating well. Think of it as a training session: you work with concentration for a while, and take a proper break when you break. Often it turns around too: something you find boring can suddenly become fun the day you get it — that \"oh, I can do this!\" moment is worth stopping to notice.\n- Empathy and hope: many find this subject hard — that is completely normal, and not a sign that you are \"not clever\". You can get there, with the right practice, just like anyone else. Use this early in the conversation, or when the student seems discouraged — not just as something you say to console them at the very end.","argumentsLongTerm":"Arguments for why the subject matters in the longer run, in the student's own life: use ONLY if the student themselves raises an objection along the lines of \"when am I ever going to need this in real life\" or similar, not something you bring up on your own initiative. Give at most one, once, then go back to the core message and the arguments for practice: this must never become the main point of the conversation or something you get stuck on. Keep the argument personal, not civic (\"this helps you\", not \"this is good for society\"). The argument available to you in this subject, fitted to what the student has told you about their own life:\n- Understanding numbers and percentages gives you control over your own money and agreements: you can see for yourself whether something is a good deal, such as what an insurance salesperson is really offering, or how to split costs fairly with the people you live with."}}}},"/assets/languages/en.json":{"code":"en","htmlLang":"en","name":"English","endonym":"English","_comment":"Alt som varierer med SPRÅK, i én fil. Legger du til et språk, er dette den ene fila som må skrives - engine.js, prompts/core.json og tre-mappene rører du ikke. Se AGENTS.md, «Ferdighetstrærne».","learner":{"_comment":"What the learner is CALLED, in the definite form the instructions and the panel use: \"the pupil\", \"the student\", \"the participant\" or anything else. A tree sets it with the config row `learner`, as free text; left out, `default` applies. `legacy` maps the keys trees used before 0.31.0 (`pupil`, `student`, `participant`) to that form, so an older file reads the same. `leadIn` is what the panel prints in front of a description; {LearnerDefinite} is the form with a capital first letter. A skill is a verb phrase (\"The student can: add ...\"), a concept a definition, and they need different lead-ins.","default":"the student","legacy":{"pupil":"the pupil","student":"the student","participant":"the participant"},"leadIn":{"skill":"{LearnerDefinite} can:","concept":"{LearnerDefinite} can explain:","fact":"{LearnerDefinite} can recall:"}},"ui":{"backLink":"← all skill trees","pageTitle":"Skill tree for {title}","tagline":"A map of how skills and concepts build on one another — tick off what you have mastered, and copy an AI instruction to practise what comes next.","makeYourOwn":"{subject}. Make your own tree:","progressLabel":"{done} of {total} skills completed","zoomIn":"Zoom in","zoomOut":"Zoom out","fitToView":"Show the whole tree","fitToViewTitle":"Show the whole tree (Ctrl+scroll to zoom)","close":"✕ Close","closeLower":"✕ close","copied":"Copied!","copyFallback":"Could not copy automatically — copy the text below manually:","errorBanner":"⚠ {n} problem(s) found in the data files (see console for details):","errorCsv":"The spreadsheet could not be read on row {row}: {message}","errorUnknownDep":"Node “{id}” lists “{dep}” as a prerequisite, but no node has that id.","errorNoTopic":"Node “{id}” has no topic, and ends up in the catch-all column “{topic}”.","errorUnknownResourceNode":"resources.csv refers to the node id “{id}”, which does not exist in tree.csv.","errorExamsRenamed":"Row {row} of tree.csv: the setting “features.exams” is now “features.resources”, and exams.csv is now resources.csv with the columns node_id, group, label and url. Nothing was applied.","errorCycle":"These nodes are prerequisites for each other, in a circle: {cycle}. One of those links has to go.","errorUnknownConfig":"Unknown setting “{key}” on row {row} of tree.csv. Nothing was applied.","errorUnknownNodeType":"The node “{id}” has the type “{type}”, which does not exist. The types are: {valid}.","errorUnknownPromptSection":"Unknown section “{section}” in the prompt row on row {row} of tree.csv. Nothing was applied.","errorUnknownPromptTarget":"The prompt row on row {row} of tree.csv is aimed at “{name}”, which is not an instruction this tree composes. Nothing was applied.","errorDidYouMean":"Did you mean “{key}”?","errorMissingConfig":"tree.csv has no config row for “{key}”, which is required.","errorStyleColor":"The setting “{key}” on row {row} of tree.csv must be a colour written as a hex code, like #1F6F4A. “{value}” is not one, so the default colour was kept.","errorStyleFont":"Unknown font “{value}” on row {row} of tree.csv. The fonts a tree can use: {valid}. The default font was kept.","nodeType":{"skill":"skill","concept":"concept","fact":"facts"},"badges":{"del1":"Part 1","del2":"Part 2","begge":"Part 1+2"},"status":{"mastered":"Mastered","ready":"Ready to learn","notMastered":"Not mastered yet","blocked":"Missing first: {codes}"},"help":{"label":"How do I use this page?","heading":"How do I use this page?","sections":[{"id":"menuButton","heading":"The menu button","body":"Press the ☰ button at the bottom left, next to this help button, to open a menu with the back link, light/dark mode, your progress and the other buttons on the page — explained below."},{"id":"map","heading":"The map","body":"The map shows how skills and concepts build on one another, from the most basic at the top to the most composite at the bottom. Boxes you do not have the prerequisites for yet appear grey and locked — tick off the ones you are missing first. Drag to pan the map, and use +/- or the mouse wheel to zoom."},{"id":"clickBox","heading":"Click a box","body":"When you click a box you get the prerequisites, a full description of the learning goal, and an AI instruction you can copy and paste into an AI chat to practise that particular skill. Mark the box as mastered when you know it — your progress is saved in your browser, and you can remove the mark again whenever you like."},{"id":"goalIndex","heading":"“Show all learning goals”","body":"This button gives you a single systematic list of every learning goal in the course, sorted by topic — useful when you want an overview or want to read the whole list without clicking through the map. Each goal shows its status: ✓ means you have marked it as mastered, ◇ means you have everything you need to learn it now, and ⊘ shows which goals you should take first (with their code, e.g. C1)."},{"id":"search","heading":"“Search”","body":"The search looks in the name, the description and the topic of every learning goal, and marks where the word occurs. It is the quickest way into the map when you remember a word from a learning goal but not which topic it sits under. Click a result to go to the node."},{"id":"lessonPlan","heading":"“Build a lesson plan” (for teachers)","body":"At the bottom of “Show all learning goals”, teachers can tick the learning goals the next lesson should cover, set the length of the lesson, and get an AI instruction for a complete lesson plan: a starter, a walkthrough using the example-problem pair model, diagnostic questions and retrieval practice at the end. The mastery ticks are your own, in your own browser — they show what you personally have been through, not what the class actually knows."},{"id":"exam","heading":"“Make a test from mastered skills”","body":"This button gives you an AI instruction for a test covering a selection of what you have already marked as mastered. Paste it into an AI chat to test yourself across several skills at once."},{"id":"aids","heading":"The aid tag","body":"The tag on a box shows which aid level the skill belongs to — for example \"Part 1\" or \"Part 2\". If it is split into several colours, the skill belongs to several levels, and you should be able to manage it under the most restrictive one. Click the tag to open \"About the course\", where each level is explained.","when":"feature:aids"},{"id":"motivation","heading":"“Why should I learn this?”","body":"This button gives you an AI instruction for a short conversation about why the subject is worth learning at all. Paste it into an AI chat if you need a nudge in the right direction.","when":"feature:motivation"}]},"goalIndex":{"button":"Show all learning goals","title":"Show a systematic list of every learning goal, sorted by topic","heading":"All learning goals","copyAll":"Copy all","intro":"The list shows every learning goal in the course, sorted by topic, with the status of each. For teachers: tick the learning goals the next lesson should cover, and build a complete lesson plan at the bottom.","openNode":"Go to this node in the map"},"search":{"button":"Search","title":"Search the learning goals by name and description","heading":"Search","placeholder":"Search the learning goals …","hint":"Type a word. The search looks in the name, the description and the topic of every learning goal, and you can click straight through to the node in the map.","noResults":"No learning goal contains “{query}”.","countOne":"1 learning goal","countMany":"{n} learning goals","openNode":"Go to this node in the map"},"motivation":{"button":"Why should I learn this?","title":"Copy an AI instruction for a conversation about why the subject is worth learning"},"lesson":{"button":"Build a lesson plan (for teachers)","title":"Copy an AI instruction for a complete lesson covering the goals you have ticked","minutesAria":"Length of the lesson in minutes","includeAria":"Include “{name}” in the lesson plan","selectedNone":"No learning goals selected","selectedOne":"1 learning goal selected","selectedMany":"{n} learning goals selected"},"exam":{"button":"Make a test from mastered skills","title":"Copy an AI instruction to build a test based on what you have marked as mastered","none":"No mastered skills yet","countLabel":"Number of tasks","countAria":"Number of tasks in the test"},"node":{"markMastered":"Mark as mastered"},"column":{"markAll":"Mark every skill in “{topic}” as mastered","clearAll":"Remove the mastered mark from every skill in “{topic}”"},"detail":{"show":"Show AI instruction","hide":"Hide AI instruction","copy":"Copy AI instruction","prereqs":"Prerequisites","resources":"Resources","mastered":"✓ Mastered","available":"Available — prerequisites are met","locked":"Locked — prerequisites missing","empty":"Click a node in the map to see details."},"loadError":"Critical error while loading: {message} (are you serving the page through a local server? fetch() of the data files fails when index.html is opened straight from disk in many browsers.)","defaultTopic":"Other","aids":{"heading":"Aids","tagTitle":"See what you may use at this level","multipleNote":"This skill belongs to several levels. You should be able to manage it under the most restrictive of them — that is, with the fewest aids.","multipleNoteGeneral":"A skill can belong to several levels. Its tag is then split into several colours, and you should be able to manage the skill under the most restrictive of those levels — that is, with the fewest aids."},"menu":{"label":"Menu"},"download":{"button":"Download this tree","title":"Download the tree twice over: the spreadsheet you can edit, and a single file that works offline","working":"Building the single file…","failed":"The single file could not be built","edit":"Edit or download","editTitle":"Open the tree in the editor, where you can change it and download it as a spreadsheet or as a single file that works offline"},"courseInfo":{"button":"About the course","heading":"About the course","division":"Year or faculty","curriculum":"Curriculum","institution":"Institution","country":"Country","language":"Language","size":"Size","decompositionVersion":"Decomposition model","credits":"Made by","author":"Author","updated":"Last updated","license":"Licence","basedOn":"Based on","skills":"{n} skills","concepts":"{n} concepts","facts":"{n} fact lists","nodes":"{n} nodes"}},"prompt":{"_comment":"The fallback language layer. A tree whose language has no languages/<code>.json yet falls back to this file for the UI, but NOT for outputLanguage — the engine generates that from the tree's own `language` field, so a German tree converses in German on day one with no translation work. `writingStyle` holds one English example of the active-voice advice (Vidar, 2026-10-03: it should not be empty). Because this file also serves every language that has no file of its own, the example says to apply the same idea in the conversation language. The language-independent half of that advice is NOT missing — it lives in prompts/shared.json → writingStyleGeneral and applies to every tree regardless. NOTE: `outputLanguage` says which language the conversation STARTS in — it must not forbid the student from asking for another one. The student's right to ask for a different language, and what happens when they do, is language-independent and lives in prompts/shared.json → languageSwitch. Do not write an absolute prohibition here: the two would contradict each other, and the model follows the prohibition.","outputLanguage":"Conduct the conversation in {conversationLanguage}: the skill tree below is written in it, and {learnerDefinite} expects it. Do not switch language on your own initiative or comment on the language of these instructions. Address {learnerDefinite} as \"you\"; where the role must be named, the word is “{learnerDefinite}”.","writingStyle":"An example in English of the first piece of advice above (in another conversation language, apply the same idea in that language):\n- Active voice: write \"we can write the number as …\", not \"the number can only be written as …\"; write \"we do this by …\" or \"you do this by …\", not \"this is done by …\". Avoid \"is done\" and \"can be done\" where you can say who does it.","overrides":{}}}};</script>
  <script>/*! AI Skill Trees engine · Copyright (c) 2026 Vidar Skogvoll · MIT License · https://github.com/vidarsko/ai-skill-trees */
'use strict';

/* Motorens egen adresse, lest MENS fila kjører - `document.currentScript`
   er bare gyldig der, ikke senere inne i en funksjon. Nedlastingsknappen
   bruker den til å finne mappa resten av maskineriet ligger i, framfor å
   hardkode «/assets/engine/»: motoren skal kunne serveres fra hvilken som
   helst sti, og gjør det allerede i enkeltfil-utgaven. */
const ENGINE_SRC = (typeof document !== 'undefined' && document.currentScript)
  ? document.currentScript.src : '';

/* ------------------------------------------------------------------ */
/* Delt motor for ferdighetstre-appene.                                */
/*                                                                      */
/* DENNE FILA INNEHOLDER INGEN BRUKERVENDT TEKST. Ikke skriv en streng  */
/* her som et menneske skal lese - verken en knappetekst eller en       */
/* setning i en KI-instruks. Det er hele poenget med oppdelingen under, */
/* og grunnen til at det finnes ÉN motor framfor én per språk.          */
/*                                                                      */
/* Fire lag, delt etter hva teksten varierer med:                       */
/*                                                                      */
/*   /prompts/                Pedagogikken. ENGELSK er kilden. Sier HVA */
/*                            modellen skal gjøre, aldri på hvilket     */
/*                            språk. Én fil per bidrag i artikkelen,    */
/*                            hver med sitt eget `version`:             */
/*                              manifest.json        indeksen           */
/*                              practice-tutor.json  bidrag 2           */
/*                              test-generator.json  bidrag 3           */
/*                              motivation.json      bidrag 4           */
/*                              lesson-plan.json     bidrag 5           */
/*                              shared.json          seksjoner brukt av */
/*                                                   flere av dem       */
/*                              decomposition.json   bidrag 1          */
/*                              authoring.json       rammeteksten rundt */
/*                                                   den. Begge har     */
/*                                                   audience=teacher   */
/*                                                   og leses ikke her  */
/*   /assets/prompts/subjects/Alt som varierer med FAGFAMILIE, og som   */
/*     <familie>.json         altså er sant for matematikk men ikke for */
/*                            samfunnsfag. Legger seksjoner TIL de      */
/*                            generelle instruksene. Et tre velger med  */
/*                            `subjectFamily` i tree.csv.               */
/*   /assets/languages/<kode>.jsonAlt som varierer med SPRÅK: knappetekster,*/
/*                            hjelpeteksten, og språklaget i instruksen */
/*                            (`outputLanguage` + `writingStyle`).      */
/*   ./tree.csv               ALT som er dette treets eget, i ÉN fil:   */
/*                            nodene, konfigurasjonen (config-rader) og */
/*                            lærerens egne instruks-overstyringer      */
/*                            (prompt-rader). `type`-kolonnen sier hva  */
/*                            raden er. tree.json og noder.csv er       */
/*                            borte fra og med 0.2.0.                   */
/*   ./resources.csv           Valgfri: ressurser per node (eksamens-   */
/*                            oppgaver, lærebok, video ...).           */
/*                                                                      */
/* Bakgrunnen: fram til 2026-09-20 fantes motoren i to eksemplarer,     */
/* ferdighetstre/engine.js og fardighetstrad/engine.js på skogvoll.com  */
/* - 107 KB hver, med en kommentar øverst om at enhver logikkendring    */
/* måtte speiles manuelt i den andre. De skilte seg på 527 linjer, og   */
/* alle 527 var tekst. Et nytt språk koster nå ÉN fil under             */
/* /languages/, ikke en kopi av denne.                                  */
/*                                                                      */
/* Rekkefølgen tekst slås opp i (mest spesifikk vinner):                */
/*   1. kjøretidsseksjon bygget av motoren (forutsetningslista o.l.)    */
/*   2. tree.csv     → prompt-rad (instruks + seksjon, eller * + seksjon)*/
/*   3. språkfila    → prompt.overrides.<instruks>.<seksjon>            */
/*   4. språkfila    → prompt.<seksjon> (outputLanguage, writingStyle)  */
/*   5. fagfamilien  → instructions.<instruks>.sections.<seksjon>       */
/*                     (eller .add[].text for en helt ny seksjon)       */
/*   6. instruksmodulen → sections.<seksjon>                            */
/*   7. shared.json  → sections.<seksjon>                               */
/* Punkt 3 er grunnen til at «engelsk kjerne + språklag» og «full       */
/* oversettelse» er samme mekanisme: et språk kan overstyre én seksjon  */
/* eller alle, uten at noe annet endres.                                */
/* Punkt 5: fagfamilien ERSTATTER en generell seksjon (`sections`), slik */
/* at hvert punkt har ÉN tekst - familiens, eller den generelle når     */
/* treet ikke har familie. Fra 0.25.0; før det la familien til egne     */
/* seksjoner etter den generelle. `add` finnes fortsatt, men bare for   */
/* en seksjon den generelle instruksen ikke har (practiceLanguage).     */
/*                                                                      */
/* STIENE BEGYNNER MED /assets/ (fra 0.4.0). Maskineriet ligger samlet   */
/* under ett prefiks på det publiserte nettstedet, fordi /prompts/ er en */
/* SIDE der - og fordi et prefiks som sier «filer sidene laster, ikke    */
/* sider man besøker» er det eneste som hindrer den kollisjonen i å      */
/* skje igjen. Mappenavnene i dette repoet er uendret; det er bare       */
/* URL-ene de publiseres på som har fått prefikset.                      */
/* ------------------------------------------------------------------ */

/* Fylles av bootstrap() før init(). Ingen av dem er `const`, fordi de
   ikke kan leses før tre fetch-er har kommet tilbake - det er den ene
   reelle forskjellen fra den gamle synkrone config.js-modellen. */
let CONFIG = null;          // utledet av config-radene i ./tree.csv
let VOCAB = null;           // /trees/vocabulary.json (kontrollert vokabular for nøklene
                            //   country, institution, division, subjectArea, language)
let LANG = null;            // /languages/<kode>.json
let CORE = null;            // { prompts: { <id>: instruksmodul } } - satt sammen av
                            //   bootstrap() fra /prompts/manifest.json. Formen er den
                            //   samme som den gamle core.json hadde, med vilje: resten
                            //   av motoren leser CORE.prompts[navn] og merker ikke at
                            //   fila er blitt til seks.
let SHARED = {};            // /prompts/shared.json → sections (delt mellom instrukser)
let FAMILY = null;          // /prompts/subjects/<familie>.json, eller null
let MANIFEST = null;        // /prompts/manifest.json - versjonene artikkelen siterer
let NODE_ROWS = [];         // node-radene i ./tree.csv, satt av bootstrap()
/* Ordrett kildetekst, ikke de parsede radene. Nedlastingsknappen gir
   læreren tilbake NØYAKTIG fila treet ble bygget av - et regneark satt
   sammen fra NODE_ROWS igjen ville mistet radrekkefølge, tomme kolonner
   og alt annet motoren ikke bryr seg om. */
let TREE_CSV_TEXT = '';     // ./tree.csv slik den står
let RESOURCES_CSV_TEXT = null;  // ./resources.csv slik den står, eller null
let PROMPT_ROWS = {};       // prompt-radene i ./tree.csv: { '<instruks>.<seksjon>': tekst }
                            //   '*' som instruks betyr «alle instrukser».
let PROMPT_ROW_AT = {};     // samme nøkler → radnummeret i regnearket, så en
                            //   prompt-rad som ikke treffer noe kan navngis.
let CONFIG_ROW_AT = {};     // config-nøkkel → radnummeret, av samme grunn.

let STORAGE_KEY = null;
let TOPIC_ORDER = [];
let FEATURES = {};
let SHOW_MOTIVATION_BUTTON = false;
let CONVERSATION_LANGUAGE = '';
let LEARNER = '';           // hva den som lærer HETER, i bestemt form («eleven»,
                            //   «the student»): config-raden `learner` som fritekst,
                            //   ellers språkfilas `learner.default`. Se resolveLearner().

let LAYOUT = {
  nodeWidth: 210,
  nodeHeight: 92,
  hGap: 34,
  vGap: 96,
  columnGap: 56,
  columnLabelHeight: 28,   // emnebåndet øverst — holdes lavt, se .column-header i tree.css
  maxNodesPerRow: 3, // bryt en emne-rad i flere rader nedover når den blir bredere enn dette
  padding: 12,             // luft rundt hele lerretet; var 20 til 2026-09-20
  barycenterPasses: 4,
};

/* ------------------------------------------------------------------ */
/* Oppslag av tekst                                                     */
/* ------------------------------------------------------------------ */

/* t('exam.button') → knappeteksten på gjeldende språk.
   t('column.markAll', { topic: 'Statistikk' }) fyller {topic}.
   Finnes ikke nøkkelen, returneres nøkkelen selv - en manglende
   oversettelse skal vises som en synlig nøkkel, ikke som tom knapp. */
function t(path, vars) {
  let cur = LANG && LANG.ui;
  for (const part of path.split('.')) {
    if (cur == null) break;
    cur = cur[part];
  }
  return typeof cur === 'string' ? fill(cur, vars) : path;
}

/* Fyller {navn} fra `vars`. En plassholder uten verdi blir stående som
   den er, slik at den er lett å få øye på framfor å bli til "undefined". */
function fill(text, vars) {
  if (!vars) return text;
  return String(text).replace(/\{(\w+)\}/g, (whole, name) =>
    Object.prototype.hasOwnProperty.call(vars, name) && vars[name] != null
      ? String(vars[name]) : whole);
}

/* Visningsnavnet for en nodetype. Selve VERDIEN i CSV-en ('skill',
   'concept') er et dataenum og er ENGELSK på alle språk - også i den
   norske og den svenske tree.csv. Bare etiketten oversettes. */
function typeLabelText(type) {
  const map = (LANG.ui.nodeType) || {};
  return map[type] || type;
}

/* Hva den som lærer HETER, i bestemt form. Fra 0.31.0 er `learner` fritekst
   i tree.csv («kursdeltakeren»), fordi den bestemte formen er den eneste
   instruksene og panelet bruker - de andre bøyningene i språkfila ble
   aldri lest. Verdiene trærne brukte før (`pupil`, `student`,
   `participant`) oversettes av språkfilas `learner.legacy`, slik at en
   eldre fil leses likt. Uten raden gjelder språkets `learner.default`. */
function resolveLearner() {
  const spec = (LANG && LANG.learner) || {};
  const asked = String(CONFIG.learner || '').trim();
  const legacy = spec.legacy || {};
  if (asked) return Object.prototype.hasOwnProperty.call(legacy, asked) ? legacy[asked] : asked;
  return spec.default || 'the student';
}

/* Ledeteksten panelet setter foran beskrivelsen. Den står IKKE i CSV-en:
   «Eleven kan ...» gjentatt i hver eneste celle er presentasjon lagret som
   data - den kan ikke oversettes, ikke styles, og stjeler oppmerksomheten
   til den som leser kolonnen. Beskrivelsen er derfor en bar verbfrase for
   en ferdighet og en bar definisjon for et begrep, og ledeteksten er det
   ene stedet ordene står. De to typene trenger hver sin: en definisjon er
   ingen verbfrase, og «Eleven kan: Posisjonen til et siffer bestemmer
   verdien» går ikke opp. Vidars beslutning, 2026-09-21. */
function learnerLeadIn(type) {
  const lead = (LANG && LANG.learner && LANG.learner.leadIn) || {};
  const tmpl = lead[type] || lead.skill || '{LearnerDefinite}:';
  return tmpl.replace('{LearnerDefinite}', LEARNER.charAt(0).toUpperCase() + LEARNER.slice(1));
}

/* Ordet for den som lærer, som {learnerDefinite}. Det kan bare brukes i
   SPRÅKLAGET og i tree.csv, ikke i
   prompts/: de står på treets språk, og limt inn i den engelske kjernen
   ville de gitt «helping eleven practise». */
function learnerVars() {
  return { learnerDefinite: LEARNER };
}

/* En begrepsnode kan definere FLERE begreper - «Intron og ekson» er ett
   element i kartet og to definisjoner. Konvensjonen er én linje per
   definisjon, på forma «Term: definisjon», og motoren splitter bare på
   linjeskift: det finnes ingen parsing som kan gå i stykker fordi en
   definisjon inneholder et kolon eller et semikolon. Én linje betyr ett
   begrep, og da bærer nodenavnet termen - den skal ikke gjentas i cella. */
function descriptionLines(text) {
  return String(text || '').split(/\r?\n/).map(line => line.trim()).filter(Boolean);
}

/* Samme tekst på én linje, til listene i prøve- og øktinstruksen, der hver
   node har nøyaktig én linje å stå på. */
function descriptionInline(text) {
  return descriptionLines(text).join('; ');
}

/* «Term: definisjon» → termen, når linja ser sånn ut. Alle begreper skrives
   på den forma, også de som definerer bare ett - ellers ser to nabonoder
   helt ulike ut for leseren, og det var det som gjorde at regelen ble
   utvidet (Vidar, 2026-09-21). En ferdighet har ingen term, og en linje
   uten kolon settes som den er. */
function definitionTerm(line) {
  const m = /^([^:]{1,60}):\s+(.+)$/.exec(line);
  return m ? { term: m[1], rest: m[2] } : null;
}

/* En faktanode er en SAMLING, én linje per element: «stikkord: svar»,
   samme form og samme splitting som begrepenes «Term: definisjon» - bare
   det før det første kolonet er venstresiden. Uten grensen på 60 tegn,
   fordi et stikkord kan være lengre enn en term («året Norge ble med i
   NATO»), og en for lang venstreside ellers ville blitt lest som en regel
   uten at noen merket det. En linje UTEN kolon er en REGEL som elementene
   lages fra («alle produkter a × b der a og b er fra 1 til 10»), og settes
   som den er. Vidars beslutning, 2026-09-30. */
function factItem(line) {
  const m = /^([^:]+):\s+(.+)$/.exec(line);
  return m ? { term: m[1], rest: m[2] } : null;
}

/* Typene en node kan ha. Verdien er et engelsk dataenum i alle språk. */
const NODE_TYPES = ['skill', 'concept', 'fact'];

/* ------------------------------------------------------------------ */
/* Komposisjon av KI-instruks                                           */
/*                                                                      */
/* Rekkefølgen på seksjonene er DATA (`groups` i instruksmodulen), slik */
/* at den kan endres uten å røre kode. HVILKEN betingelse en seksjon har */
/* er også data (`when`); hva betingelsen betyr er logikk, og bor her.  */
/* ------------------------------------------------------------------ */

/* Hvilke seksjoner som gjelder NÅR. Modulen sier hvilken betingelse en
   seksjon har (`when` i JSON-en, et navn herfra); hva navnet betyr er
   logikk, og bor her. Navnet er også det byggeren og /prompts/ viser
   («Nodes with prerequisites»), så det skal si hva det gjelder, ikke
   hvordan det regnes ut. Fram til 0.25.0 var tabellen nøklet på
   instruks.seksjon her i koden, og sidene kunne bare si «noen ganger». */
const CONDITIONS = {
  /* Lærerens egen tekst om kurset er tom by default: et tre som ikke
     setter slotten skal se ut nøyaktig som før. */
  courseSpecifics:  (ctx, name) => courseSpecificsApplies(name),
  expressionFocus:  ctx => !!slot('expressionFocus'),
  hasPrerequisites: ctx => !!(ctx.ancestors && ctx.ancestors.length > 0),
  noPrerequisites:  ctx => !ctx.ancestors || ctx.ancestors.length === 0,
  /* «Alt som ikke er et begrep» fram til fakta-typen kom (0.21.0). */
  skillNode:        ctx => !ctx.node || (ctx.node.type !== 'concept' && ctx.node.type !== 'fact'),
  conceptNode:      ctx => !!(ctx.node && ctx.node.type === 'concept'),
  /* Bare når noden faktisk holder flere definisjoner: teksten forklarer
     et format, og et format som ikke er der trenger ingen forklaring. */
  severalConcepts:  ctx => !!(ctx.node && ctx.node.type === 'concept' &&
                              descriptionLines(ctx.node.description).length > 1),
  factNode:         ctx => !!(ctx.node && ctx.node.type === 'fact'),
  nodeInstruction:  ctx => !!(ctx.node && ctx.node.instruction),
  /* Én node har sine nivåer på noden; et utvalg (prøve, økt) har dem samlet
     i aidsText. */
  aids:             ctx => treeUsesAids() &&
                           (ctx.node ? (ctx.node.aids || []).length > 0 : !!ctx.aidsText),
  severalAids:      ctx => !!ctx.multipleAids,
  hasConcepts:      ctx => !!ctx.hasConcepts,
  allConcepts:      ctx => !!ctx.allConcepts,
  someConcepts:     ctx => !!ctx.hasConcepts && !ctx.allConcepts,
  hasFacts:         ctx => !!ctx.hasFacts,
};

/* Betingelsen en seksjon har i en instruks, som navn, eller null. En
   seksjon fagfamilien LEGGER TIL (`add`) arver betingelsen til seksjonen
   den står etter, med mindre den oppgir sin egen. */
function sectionCondition(promptName, id) {
  const spec = CORE.prompts[promptName] || {};
  const when = spec.when || {};
  if (when[id]) return when[id];
  const add = familyAdds(promptName).find(a => a.id === id);
  if (add && add.when) return add.when;
  if (add && add.after) return sectionCondition(promptName, add.after);
  return null;
}

function slot(name) {
  return (CONFIG.slots || {})[name];
}

/* Seksjonen vises når treet HAR noe å si: enten via `slots.courseSpecifics`,
   som er den vanlige veien, eller via en prompt-rad som skriver om selve
   seksjonen. Uten det andre leddet ville en slik rad blitt lest, vist tilbake
   som en innstilling, og så aldri gjort noe - nøyaktig den stillheten
   validatePromptRows() finnes for å hindre. */
function courseSpecificsApplies(promptName) {
  return !!slot('courseSpecifics') ||
         PROMPT_ROWS[promptName + '.courseSpecifics'] != null ||
         PROMPT_ROWS['*.courseSpecifics'] != null;
}

/* Det fagfamilien har for ÉN instruks: `sections` erstatter generelle
   seksjoner, `add` er seksjoner den generelle instruksen ikke har, som en
   liste av { id, after, text }. Tomt for et tre uten `subjectFamily`. */
function familyPart(promptName) {
  return (FAMILY && FAMILY.instructions && FAMILY.instructions[promptName]) || {};
}
function familyAdds(promptName) {
  return familyPart(promptName).add || [];
}
function familyText(promptName, id) {
  const own = familyPart(promptName).sections || {};
  if (own[id] != null) return own[id];
  const add = familyAdds(promptName).find(a => a.id === id);
  return add && add.text != null ? add.text : null;
}

/* Slår opp teksten for én seksjon. Se rekkefølgen i filhodet. */
function sectionText(promptName, id, ctx) {
  if (ctx.sections && ctx.sections[id] != null) return ctx.sections[id];

  /* prompt-radene i tree.csv. Mest spesifikk vinner: en rad som navngir
     instruksen slår en rad som gjelder alle. Dette er det stedet LÆREREN
     redigerer, så det ligger øverst av det som kommer fra filer. */
  const fromCsv = PROMPT_ROWS[promptName + '.' + id];
  if (fromCsv != null) return fromCsv;
  const fromCsvAll = PROMPT_ROWS['*.' + id];
  if (fromCsvAll != null) return fromCsvAll;

  const langPrompt = (LANG.prompt || {});
  const fromLangOverride = ((langPrompt.overrides || {})[promptName] || {})[id];
  if (fromLangOverride != null) return fromLangOverride;
  if (langPrompt[id] != null) return langPrompt[id];

  const fromFamily = familyText(promptName, id);
  if (fromFamily != null) return fromFamily;

  const spec = CORE.prompts[promptName];
  if (spec && spec.sections[id] != null) return spec.sections[id];

  return SHARED[id] != null ? SHARED[id] : null;
}

/* Gruppene i en instruks: [{ title, sections }]. Fra 0.25.0 har en modul
   `groups` med en overskrift hver - «Role and style», «How to teach» ... -
   som også skrives inn i den ferdige instruksen. En modul med bare
   `order` er én gruppe uten overskrift. */
function sectionGroups(promptName) {
  const spec = CORE.prompts[promptName];
  if (spec.groups) return spec.groups;
  return [{ title: '', sections: spec.order || [] }];
}

/* Overskriften på gruppa en seksjon står i, etter at familiens nye
   seksjoner er flettet inn: de står i gruppa til ankeret sitt. */
function sectionGroup(promptName, id) {
  const groups = sectionGroups(promptName);
  const g = groups.find(gr => gr.sections.indexOf(id) !== -1);
  if (g) return g.title;
  const add = familyAdds(promptName).find(a => a.id === id);
  return add && add.after ? sectionGroup(promptName, add.after) : (groups[groups.length - 1] || {}).title || '';
}

/* Alle seksjonene i rekkefølge, med fagfamiliens NYE seksjoner flettet inn
   etter ankeret hver av dem oppgir. En familie som erstatter en seksjon
   flytter ingenting - den vinner på plassen seksjonen har fra før, via
   sectionText() over. */
function sectionOrder(promptName) {
  const order = sectionGroups(promptName).reduce((acc, g) => acc.concat(g.sections), []);
  familyAdds(promptName).forEach(add => {
    if (order.indexOf(add.id) !== -1) return;
    const at = add.after ? order.indexOf(add.after) : -1;
    if (at === -1) order.push(add.id);
    else order.splice(at + 1, 0, add.id);
  });
  return order;
}

/* En seksjon fra en fagfamilie arver betingelsen til seksjonen den er
   forankret etter. Uten dette ville f.eks. matematikkens utdyping av
   `conceptGuidance` stått på hver eneste ferdighetsnode, ikke bare på
   begrepsnodene - se `_conditions` i prompts/manifest.json. */
function sectionApplies(promptName, id, ctx) {
  const name = sectionCondition(promptName, id);
  if (!name) return true;
  const test = CONDITIONS[name];
  if (!test) {
    console.warn('Ukjent betingelse «' + name + '» på ' + promptName + '.' + id);
    return true;
  }
  return test(ctx, promptName);
}

function composePrompt(promptName, ctx) {
  const spec = CORE.prompts[promptName];
  if (!spec) throw new Error('Ukjent instruks: ' + promptName);
  ctx = ctx || {};

  const vars = Object.assign(
    { conversationLanguage: CONVERSATION_LANGUAGE, examButtonLabel: t('exam.button') },
    learnerVars(),
    CONFIG.slots || {},
    ctx.vars || {});

  const out = [];
  let heading = null;
  sectionOrder(promptName).forEach(id => {
    if (!sectionApplies(promptName, id, ctx)) return;
    const text = sectionText(promptName, id, ctx);
    if (text == null || text === '') return;
    /* Overskriften skrives først når gruppa faktisk har en seksjon med
       tekst, så en gruppe der ingenting gjelder ikke står igjen tom. */
    const group = sectionGroup(promptName, id);
    if (group && group !== heading) out.push('## ' + group);
    heading = group;
    /* Stikkordet står foran teksten: «role: ...». Det gjør to ting på én
       gang. Modellen får strukturen XML-tagger ville gitt den, uten at
       instruksen ser ut som kode for den som limer den inn — og læreren
       ser nøyaktig hvilket ord som skal stå i `name`-kolonnen den dagen
       hen vil skrive om én del av den, med en `prompt`-rad i tree.csv.
       Stikkordene er engelske, som alt annet i prompts/; teksten etter
       kolonet er treets eget språk. */
    out.push(id + ': ' + fill(text, vars));
  });
  return out.join('\n\n');
}

/* Hjelpemiddelteksten er fagets egen prosa og bor i tree.csv, ikke her. */

/* kommer en fullført oppgave, og det eneste stedet det er verdt å måle.*/
/*                                                                      */
/* Vi teller IKKE avhukinger, nodeåpninger eller framdrift: det ville   */

/* hvilken type og hvilken node.                                        */

// «/trees/no-vgs-matte-2p/» → «no-vgs-matte-2p». Slug-en er mappenavnet; det finnes
// ingen egen id i config, og mappenavnet er allerede nøkkelen i
// /trees/trees.json.
function treeSlug() {
  const parts = location.pathname.split('/').filter(Boolean);
  const i = parts.indexOf('trees');
  return (i !== -1 && parts[i + 1]) ? parts[i + 1] : (parts[parts.length - 1] || 'unknown');
}

function trackCopy(kind, extra) {
  if (!window.aistTrack) return;
  const params = { tree_slug: treeSlug(), instruction_kind: kind };
  if (extra) Object.keys(extra).forEach(k => { if (extra[k] != null) params[k] = extra[k]; });
  window.aistTrack('copy_instruction', params);
}
