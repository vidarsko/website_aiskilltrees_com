  <!--
    ===================================================================
    ENKELTFIL-UTGAVEN av et ferdighetstre.

    Denne fila er hele treet: motoren, stilene, instruksene, språkfila og
    selve treet ligger inne i den. Den henter ingenting, og virker derfor
    ved dobbeltklikk, uten nett og uten server.

    DET ER IKKE EN FINESSE, DET ER DET ENESTE SOM VIRKER. En side åpnet
    fra disk får opphavet `null` i nettleseren, og en side uten opphav får
    ikke lese filer ved siden av seg - `fetch()` blokkeres av CORS. En
    <script>-tagg blokkeres derimot ikke, fordi den ikke gir sida lesbare
    data, den kjører kode. Derfor kommer treet inn som `AIST_BUNDLE`
    nedenfor, altså som kode framfor som en fil som blir lest.

    KILDEFILA DI LIGGER I FILA. Regnearket står ordrett i AIST_BUNDLE
    under nøkkelen "tree.csv". Mister du CSV-en, kan du hente den ut
    derfra - denne fila er sin egen kilde.

    TILBAKELENKA ER FJERNET med vilje: dette treet ligger ikke i en
    katalog, og en lenke til et nettsted er verdiløs i en fil som nettopp
    er laget for å virke uten nett.

    Laget av byggeren på aiskilltrees.com/make-your-own/. Vil du endre
    treet, rediger regnearket og bygg en ny fil der; denne er med vilje
    skrivebeskyttet, slik at den er trygg å dele videre til en klasse.
    ===================================================================

  <style>/*! AI Skill Trees engine · Copyright (c) 2026 Vidar Skogvoll · MIT License · https://github.com/vidarsko/ai-skill-trees */
/* ==========================================================================
   engine/tokens.css — the engine's DEFAULT palette and type.

   Why this file exists
   --------------------
   `tree.css` styles the graph entirely through custom properties, and until
   this file was written every one of them was defined by the website that
   happened to host it. The engine therefore could not render anywhere else:
   dropped into a folder on a teacher's laptop it came out unstyled, because
   `--paper`, `--ink`, `--primary` and the rest lived in the site's own
   `tokens.css`.

   This file inverts that. The engine now ships a complete, working palette,
   and a host site overrides whichever values it wants by loading its own
   token file AFTER this one. The values below are the ones aiskilltrees.com
   used when the engine was extracted, so nothing changed visually on that
   site — it simply stopped being the only place the engine works.

   Load order on a page that renders a tree:

       engine/tokens.css     <- defaults (this file)
       <host tokens, if any> <- optional overrides, later wins
       engine/tree.css       <- consumes the tokens

   Contrast: every pairing below was checked against its background at AA or
   better. If you override a colour, check it again — the graph puts small
   text on tinted fills in several places.
   ========================================================================== */

:root {
  /* ---- Surfaces and ink ------------------------------------------------- */
  --paper:         #F6F4EF;
  --paper-2:       #EDEAE2;
  --surface:       #FFFFFF;
  --ink:           #1A1D1B;
  --ink-3:         #646964;
  --ink-inverse:   #F6F4EF;

  /* ---- Rules and scrim -------------------------------------------------- */
  --rule:          rgba(26, 29, 27, 0.14);
  --rule-strong:   rgba(26, 29, 27, 0.30);
  --scrim:         rgba(26, 29, 27, 0.62);

  /* ---- Primary ---------------------------------------------------------- */
  --primary:        #1F6F4A;
  --primary-strong: #16543A;
  --primary-tint:   #E3EFE8;

  /* ---- Secondary accent, used for the "skill" node fill ----------------- */
  --amber:         #C8801F;
  --amber-tint:    #F7EBD9;

  /* ---- Third accent, used for the "fact" node fill ---------------------
     A clear mid blue; a darker, greyer blue read as a locked node. Blue beside
     orange is the pair most people with a colour-vision deficiency still
     tell apart; blue beside green is closer, so the fact fill is mixed
     stronger than the pale concept tint and differs in lightness too. */
  --blue:          #2563A8;   /* 6.12:1 against white */

  /* ---- Destructive ------------------------------------------------------ */
  --danger:        #C2362F;
  --danger-text:   #A32B24;
  --danger-tint:   rgba(194, 54, 47, 0.10);

  /* ---- Aid levels -------------------------------------------------------
     Read from JavaScript, not from tree.css: engine.js composes
     `var(--aid-N)` for the tag on a node, so these have to exist even
     though a search of the stylesheet will not find them.

     The colour is bound to the LEVEL, never to the subject: level 1 is
     always --aid-1. Five are defined and the sequence wraps, so a course
     with six levels reuses the first colour rather than falling back to
     nothing. They differ in hue rather than lightness, which is why the tag
     always carries a word as well — colour alone never carries meaning.
     Each is AA or better against white text. */
  --aid-1: #1F6F4A;   /* 6.12:1 */
  --aid-2: #8A5A12;   /* 5.91:1 */
  --aid-3: #1F5F7A;   /* 7.06:1 */
  --aid-4: #5B3D8A;   /* 8.47:1 */
  --aid-5: #8A2B4A;   /* 9.30:1 */

  /* ---- Elevation --------------------------------------------------------
     A deliberate, narrow exception to a flat design: the floating toolbar
     and the modals sit above a scrolling canvas and need real height. */
  --shadow-float: 0 4px 14px rgba(26, 29, 27, 0.18);
  --shadow-modal: 0 12px 40px rgba(26, 29, 27, 0.28);

  /* ---- Type -------------------------------------------------------------
     A stack of system faces, so the engine has no webfont dependency and
     works offline from a folder. A host site that wants its own face
     overrides this one line. */
  --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;

  /* The choices a tree can make with a `style.font` row. engine.js points
     --font-sans at one of these; the names are the values the row takes.
     Every stack is system faces only, for the reason above: the single-file
     edition has to look the same on a laptop with no network. */
  --font-system:   system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --font-humanist: Seravek, "Gill Sans Nova", Ubuntu, Calibri, "DejaVu Sans", source-sans-pro, sans-serif;
  --font-rounded:  ui-rounded, "Hiragino Maru Gothic ProN", Quicksand, Comfortaa, Manjari, "Arial Rounded MT", "Arial Rounded MT Bold", Calibri, source-sans-pro, sans-serif;
  --font-serif:    Charter, "Bitstream Charter", "Sitka Text", Cambria, Georgia, serif;
  --font-mono:     ui-monospace, "Cascadia Code", "Source Code Pro", Menlo, Consolas, "DejaVu Sans Mono", monospace;
}

/* ==========================================================================
   tokens.css — the single source of truth for color, type and spacing.
   Design system: aiskilltrees-style v1.3
   (canonical: ../../AgentSkills/ui-style-banded-fullbleed/SKILL.md in the work vault)

   NO other stylesheet and NO page may hardcode a hex value or a font stack.
   If a value is missing, add a token here — that is what keeps the palette
   one variable to change rather than a find-and-replace across the site.
   ========================================================================== */

@import url("fonts.css");   /* self-hosted since 2026-09-26 — see css/fonts.css */

:root {
  /* ---- Grounds ---------------------------------------------------------- */
  --paper:         #F6F4EF;   /* default page ground — warm off-white */
  --paper-2:       #EDEAE2;   /* alternate band, one step deeper */
  --surface:       #FFFFFF;   /* cards, tables, the graph canvas */

  /* ---- Ink -------------------------------------------------------------- */
  --ink:           #1A1D1B;   /* primary text, and the dark band ground — 15.5:1 on --paper */
  --ink-2:         #4A4F4B;   /* secondary text — 7.6:1 on --paper */
  --ink-3:         #646964;   /* muted: captions, metadata — 5.1:1 on --paper */
  --ink-inverse:   #F6F4EF;   /* text on --ink and --primary bands */
  --rule:          rgba(26, 29, 27, 0.14);   /* hairline separators inside a band */
  --rule-inverse:  rgba(246, 244, 239, 0.22);

  /* ---- Primary ---------------------------------------------------------- */
  --primary:        #1F6F4A;  /* deep evergreen — 6.1:1 on white, 5.6:1 on --paper */
  --primary-strong: #16543A;  /* hover/active — 8.9:1 on white */
  --primary-tint:   #E3EFE8;  /* pale band fill */

  /* ---- Signal (graph states; emphasis used sparingly) ------------------- */
  --amber:         #C8801F;   /* fills and marks only — 5.3:1 against --ink */
  --amber-text:    #8A5A12;   /* the same signal as words — 5.4:1 on --paper */
  --amber-tint:    #F7EBD9;
  --blue:          #2563A8;   /* fact nodes — 6.12:1 against white */

  /* ---- Rules and elevation ----------------------------------------------
     --rule-strong is the hairline at hover/active strength.
     The two shadows exist ONLY for the skill-tree app: its floating toolbar
     and its modals sit above a scrolling graph canvas and need real
     elevation. The design system's "no shadows" rule is about cards on a
     band ground and still holds everywhere else — do not reach for these on
     a marketing page. */
  --rule-strong:   rgba(26, 29, 27, 0.30);
  --shadow-float:  0 4px 14px rgba(26, 29, 27, 0.18);
  --shadow-modal:  0 12px 40px rgba(26, 29, 27, 0.28);

  /* ---- Danger ------------------------------------------------------------
     Validation errors in the skill-tree app (a malformed CSV, a cycle in the
     graph). --danger is the fill/rule; --danger-text is the same signal as
     words — 5.9:1 on --paper. */
  --danger:        #C2362F;
  --danger-text:   #A32B24;
  --danger-tint:   rgba(194, 54, 47, 0.10);


  /* ---- Aid levels --------------------------------------------------------
     An ORDERED palette for the `aids` column. A subject picks LEVELS, never
     colours: level 1 always gets --aid-1, level 2 --aid-2, and so on. That is
     what keeps a Norwegian «Del 1» and an IB «Paper 1» the same colour, and
     what keeps hex values out of a tree's own files.

     Levels 1 and 2 are deliberately the old --del1/--del2 values, so the 2P
     tree looks exactly as it did.

     All five carry WHITE text at AA for small text (measured, not guessed):
     6.12, 5.91, 7.06, 8.47 and 9.30 : 1. They separate by HUE, not by
     luminance — which is safe here only because an aid tag always carries its
     label in words. Never ship a wordless aid tag. */
  --aid-1: #1F6F4A;   /* evergreen — 6.12:1 on white */
  --aid-2: #8A5A12;   /* amber-brown — 5.91:1 */
  --aid-3: #2A5C86;   /* deep blue — 7.06:1 */
  --aid-4: #6E3A6B;   /* plum — 8.47:1 */
  --aid-5: #7A2E2E;   /* brick — 9.30:1 */

  /* ---- Subject colours ---------------------------------------------------
     Used by /gy25/ (and any later per-curriculum page) to colour a subject's
     level buttons when a tree exists for it. Vidar's choice 2026-10-05:
     mathematics blue, physics red, biology green; the rest picked here.
     Overlap between subjects is accepted. All carry WHITE text at AA
     (≥ 4.5:1), and a button always carries its level in words, so colour
     never carries the meaning alone — a greyed level is also disabled and
     says so to a screen reader. */
  --subject-mathematics: #2563A8;   /* blue — 6.12:1 on white (same as --blue) */
  --subject-physics:     #B3261E;   /* red — 6.5:1 */
  --subject-biology:     #1F6F4A;   /* green — 6.12:1 (same as --primary) */
  --subject-chemistry:   #8A5A12;   /* amber-brown — 5.91:1 */
  --subject-science:     #0F6B73;   /* teal — 6.2:1 */
  --subject-language:    #6E3A6B;   /* plum — 8.47:1 */
  --subject-social:      #7A2E2E;   /* brick — 9.30:1 */
  --subject-none:        #E2DFD7;   /* greyed level: no tree yet — with --ink-2 text, 6.3:1 */

  /* ---- Scrim ------------------------------------------------------------
     A FLAT overlay, not a gradient: the system has no gradients, and a
     photograph still has to be dimmed before display type can sit on it. */
  --scrim:         rgba(26, 29, 27, 0.62);

  /* ---- Type ------------------------------------------------------------- */
  --font-sans:  "Inter", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  --font-serif: "Charis SIL", "Source Serif 4", Georgia, serif;

  --step-xs:  0.875rem;                                       /* 14px — captions, metadata */
  --step-s:   1rem;                                           /* 16px — UI, labels */
  --step-m:   clamp(1.0625rem, 0.5vw + 0.95rem, 1.1875rem);   /* 17→19px — body prose */
  --step-l:   clamp(1.375rem, 1vw + 1.1rem, 1.75rem);         /* 22→28px — h3 */
  --step-xl:  clamp(1.75rem, 2vw + 1.25rem, 2.5rem);          /* 28→40px — h2 */
  --step-2xl: clamp(2.25rem, 4.5vw + 1rem, 3.75rem);          /* 36→60px — h1 */
  --step-3xl: clamp(2.75rem, 7vw + 0.5rem, 5.5rem);           /* 44→88px — hero only */

  /* ---- Spacing and measures -------------------------------------------- */
  --gutter:        clamp(1.25rem, 5vw, 4rem);   /* 20px phone → 64px desktop, INSIDE bands */
  --space-band:    clamp(3rem, 8vw, 7rem);      /* vertical padding of a band */
  --space-band-lg: clamp(4.5rem, 12vw, 10rem);  /* hero and closing CTA only */
  --measure-prose: 68ch;
  --measure-wide:  1280px;

  --space-1: 0.5rem;
  --space-2: 1rem;
  --space-3: 1.5rem;
  --space-4: 2rem;
  --space-5: 3rem;
  --space-6: 4rem;
}

/*! AI Skill Trees engine · Copyright (c) 2026 Vidar Skogvoll · MIT License · https://github.com/vidarsko/ai-skill-trees */
/* ==========================================================================
   tree.css — the skill-tree graph app (the view at /trees/<slug>/).

   PORTED from skogvoll.com's ferdighetstre/style.css, 2026-09-19. Everything
   below the bridge is that file verbatim: the layout, the detail panel, the
   floating toolbar and every tuning comment in it are the result of a lot of
   iteration and are NOT to be re-derived here. What changed on the way over is
   this header, and the override block at the very BOTTOM of the file.

   The bridge below re-expresses the names that file uses (--bg, --accent,
   --text, --radius ...) in terms of aiskilltrees-style tokens, so the app
   inherits this site's palette without touching 1000 lines of tuned CSS. If a
   value looks wrong on this site, fix it HERE, in the bridge — or, when a
   single rule rather than a color needs to change, in the override block at
   the bottom. Editing a rule in the body would make the two copies diverge
   for no reason, and makes the next port harder than it needs to be.

   The page loads tokens.css and then this file, and NOT base.css: base.css
   carries the band model and prose defaults for the marketing pages, which
   would fight the app's own layout. That means the small reset below has to
   live here.

   Design system: aiskilltrees-style v1.0. No hardcoded hex values, no font
   stacks — every color below resolves to a token in tokens.css.
   ========================================================================== */

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  /* ---- Bridge: engine token name → aiskilltrees token --------------------- */
  --bg:            var(--paper);
  --surface-hover: var(--paper-2);
  --border:        var(--rule);
  --border-strong: var(--rule-strong);
  --text:          var(--ink);
  --text-muted:    var(--ink-3);
  --accent:        var(--primary);

  /* The source system used a gradient here. aiskilltrees-style has no
     gradients at all, so the "gradient" is a flat primary fill. */
  --accent-grad:   var(--primary);

  /* "Mastered" in the graph is the primary green, per the design system's
     note on the skill-tree graph. State is never carried by color alone —
     a mastered node also gets an inset ring and a checked box. */
  --success:       var(--primary);
  --danger-soft:   var(--danger-text);

  /* Square corners are the system's rule. --radius-pill stays round: it is
     only used on circular icon buttons (zoom, menu, help), which are controls,
     not page-level containers. */
  --radius:        0;
  --radius-sm:     0;
  --radius-pill:   9999px;

  /* ---- Node types --------------------------------------------------------
     Begrep (a concept) is green and ferdighet (a skill) is orange, and the
     two are also told apart by the label on the node itself, never by fill
     alone. Both fills are opaque, so the edge lines behind a node never read
     through the card. The skill fill is 40% amber rather than the pale
     --amber-tint: at the tint it read as beige beside the green, and the two
     types stopped looking like two colours (Vidar, 2026-09-26). */
  --begrep-bg:        var(--primary-tint);
  --begrep-border:    color-mix(in srgb, var(--primary) 55%, transparent);

  --ferdighet-bg:     color-mix(in srgb, var(--amber) 40%, var(--surface));
  --ferdighet-border: var(--amber);

  /* Fakta (a fact node, from 0.21.0) is blue: a third hue, and a fill
     between the two others in strength, so it differs from the pale green
     in lightness as well as in hue. */
  --fakta-bg:         color-mix(in srgb, var(--blue) 24%, var(--surface));
  --fakta-border:     var(--blue);

  --locked-opacity: 0.45;

  --column-alt: color-mix(in srgb, var(--ink) 4%, transparent);

}

body { font-family: var(--font-sans); }


html, body { height: 100%; }

a { color: var(--accent); }

/* Den opprinnelige <header> er tømt av ensureActionMenu() (se engine.js) -
   ALT innholdet dens (tilbake-lenke, dag/natt-knapp, fremdriftslinje,
   tittel, undertekst) flyttes inn i #action-menu-panel, slik at grafen kan
   fylle hele skjermhøyden. Skjules derfor unconditionally her i CSS (ikke
   bare via JS) for å unngå et glimt av den gamle headeren før JS rekker å
   flytte innholdet. */
header {
  display: none;
}

/* The source page had a light/dark toggle. aiskilltrees-style has no dark
   mode in v1 and this page ships no toggle button, so those rules are gone.
   engine.js looks the button up with querySelector and tolerates its
   absence (see ensureActionMenu), so nothing else had to change. */

.back-link {
  display: inline-block;
  font-size: 0.85rem;
  color: var(--text-muted);
  text-decoration: none;
  border-bottom: 1px solid transparent;
  transition: border-color 0.2s, color 0.2s;
}

.back-link:hover, .back-link:focus-visible {
  color: var(--accent);
  border-bottom-color: var(--accent);
}

/* Meny-knapp nederst til venstre, til venstre for zoom-knappene i
   #bottom-toolbar (se setupZoom/getBottomToolbar i engine.js) - IKKE øverst
   til høyre, siden den da nesten overlappet tilbake-knappen i detaljpanelet
   når det er åpent på mobil (begge endte i samme hjørne). Slår ut
   #action-menu-panel, som ensureActionMenu() (engine.js) fyller med ALT som
   før lå i headeren: tilbake-lenke + dag/natt-knapp (#menu-nav-row),
   fremdriftslinje, tittel/undertekst, og til slutt de sjeldnere brukte
   knappene (læringsmål-liste, prøvegenerator, motivasjon). Selve #menu-wrap
   er bare et ankerpunkt for panelet - #bottom-toolbar (fixed) gir selve den
   flytende posisjoneringen.

   Fra 2026-09-20 ligger OGSÅ «?»-knappen og «Om faget» inne i panelet.
   Verktøylinjen har da bare burgeren og zoom-kontrollene, og burgeren er
   gjort litt større enn dem: den åpner alt det andre, så den skal lese som
   hovedknappen framfor som én av fire like. */
#menu-wrap {
  position: relative;
}

/* Bevisst større enn zoom-knappene (2,6rem) og svakt grønn: dette er
   inngangen til alt annet på sida, og den eneste knappen en ny bruker MÅ
   finne. Tinten er --primary-tint, systemets bleke grønn — nok til å skille
   den fra de nøytrale zoom-knappene, ikke nok til å lese som en CTA. */
#menu-toggle-btn {
  width: 3.5rem;
  height: 3.5rem;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--radius-pill);
  border: 1px solid color-mix(in srgb, var(--primary) 28%, transparent);
  background: var(--primary-tint);
  color: var(--primary-strong);
  cursor: pointer;
  box-shadow: var(--shadow-float);
  transition: background 0.15s ease, border-color 0.15s ease;
}

#menu-toggle-btn svg { width: 24px; height: 24px; }

#menu-toggle-btn:hover, #menu-toggle-btn[aria-expanded="true"] {
  border-color: color-mix(in srgb, var(--primary) 55%, transparent);
  background: color-mix(in srgb, var(--primary) 16%, var(--surface));
}

#action-menu-panel {
  display: none;
  flex-direction: column;
  gap: 0.6rem;
  position: absolute;
  bottom: calc(100% + 0.5rem);
  left: 0;
  z-index: 30;
  width: min(320px, calc(100vw - 2.4rem));
  max-height: calc(100vh - 5rem);
  overflow-y: auto;
  padding: 0.8rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-modal);
}

#action-menu-panel.open { display: flex; }

#menu-nav-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.8rem;
  padding-bottom: 0.6rem;
  border-bottom: 1px solid var(--border);
}

#action-menu-panel h1 {
  font-size: 1.25rem;
  font-weight: 800;
  letter-spacing: -0.02em;
  line-height: 1.2;
}

#action-menu-panel p.tagline {
  padding-bottom: 0.6rem;
  border-bottom: 1px solid var(--border);
  color: var(--text-muted);
  font-size: 0.85rem;
  line-height: 1.5;
}

#action-menu-panel #motivation-btn,
#action-menu-panel #goal-index-btn,
#action-menu-panel #course-info-btn,
#action-menu-panel #help-btn,
#action-menu-panel #download-btn,
#action-menu-panel #edit-link {
  font-size: 0.82rem;
  font-weight: 600;
  letter-spacing: 0.01em;
  padding: 0.55rem 0.9rem;
  border-radius: var(--radius-pill);
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text);
  cursor: pointer;
  width: 100%;
  text-align: left;
  white-space: normal;
  transition: background 0.15s ease, border-color 0.15s ease;
}

#action-menu-panel #motivation-btn:hover,
#action-menu-panel #goal-index-btn:hover,
#action-menu-panel #course-info-btn:hover,
#action-menu-panel #help-btn:hover,
#action-menu-panel #download-btn:hover,
#action-menu-panel #edit-link:hover {
  border-color: var(--border-strong);
  background: var(--surface-hover);
}

/* Enkeltfil-utgaven tar et par sekunder å sette sammen. Knappen sier det
   med teksten sin; dette er bare for at den ikke skal se trykkbar ut imens. */
#action-menu-panel #download-btn[disabled] {
  opacity: 0.6;
  cursor: progress;
}

/* Lenken til redigeringsverktøyet ser ut som knappene over den. */
#action-menu-panel #edit-link {
  display: block;
  box-sizing: border-box;
  text-decoration: none;
}

.progress-row {
  display: flex;
  align-items: center;
  gap: 0.9rem;
  padding-bottom: 0.6rem;
  border-bottom: 1px solid var(--border);
}

.progress-bar {
  flex: 1;
  max-width: 420px;
  height: 8px;
  background: var(--border);
  border-radius: 4px;
  overflow: hidden;
}

.progress-bar-fill {
  height: 100%;
  background: var(--accent-grad);
  width: 0%;
  transition: width 0.3s ease;
}

.progress-label {
  font-size: 0.82rem;
  color: var(--text-muted);
  white-space: nowrap;
}

#error-banner {
  display: none;
  background: var(--danger-tint);
  border-bottom: 1px solid var(--danger);
  color: var(--danger-soft);
  font-size: 0.85rem;
  padding: 0.8rem 2rem;
  white-space: pre-wrap;
}

#error-banner.visible { display: block; }

/* Øverste linje: fagnavnet, og veien videre for den som vil lage sitt eget.
   Den ligger i flex-kolonnen FØR <main>, så grafen mister nøyaktig høyden
   linja tar og ingenting legger seg oppå noe annet. Venstremargen er den
   samme som #graph-scroll har, slik at teksten står rett over den første
   kolonneoverskriften. Størrelsen er kolonneoverskriftens, men uten
   versalene og sperringen: dette er en setning, ikke en etikett. */
.made-with {
  flex: 0 0 auto;
  margin: 0;
  /* line-height: 1 fjerner den halve linjeavstanden som ellers ligger under
     teksten. De 5px ned til første emneoverskrift lages IKKE her: se
     #graph-container, som trekker lerretet opp inne i rullefeltet i
     stedet. Linja skal beholde hele sin egen høyde, ellers rulles grafen
     opp i teksten. */
  padding: 0.5rem 2rem 0;
  font-size: 0.7rem;
  line-height: 1;
  color: var(--text-muted);
}

/* Fagnavnet er det eneste som skal stikke seg ut: det sier hvilket tre dette
   er. Resten av linja er en invitasjon, og den kan ligge stille. */
.made-with strong {
  font-weight: 600;
  color: var(--text);
}

.made-with a {
  color: var(--accent);
  text-decoration: none;
  border-bottom: 1px solid transparent;
}

.made-with a:hover,
.made-with a:focus-visible {
  border-bottom-color: var(--accent);
}

main {
  flex: 1;
  display: flex;
  min-height: 0;
  width: 100%;
}

#graph-scroll {
  flex: 1;
  min-width: 0;
  overflow: auto;
  /* Ingen padding-top: over grafen står .made-with, som holder den klar av
     skjermkanten, og avstanden derfra ned til første kolonneoverskrift er
     LAYOUT.padding i selve layout-algoritmen (se
     computeGlobalRowStarts/layoutColumn). To luftrom oppå hverandre ble
     synlig for mye. */
  padding: 0 2rem 2.4rem;
  position: relative;
  cursor: grab;
}

#graph-scroll.panning {
  cursor: grabbing;
  user-select: none;
}

/* margin-top: 5px ned til første emneoverskrift, og regnestykket er dette:
   lerretet har 12px egen luft (LAYOUT.padding) som gjelder alle fire sidene
   og ikke skal krympes for å rette én av dem, så lerretet trekkes 7px opp
   INNE i rullefeltet. De 7px lå til 21.09 som negativ bunnmarg på
   .made-with, og det var feil sted: da startet #graph-scroll 7px inne i
   toppteksten, og nodekortene rullet opp over de nederste 7px av bokstavene
   i stedet for å stoppe under dem. Her er det bare tomrommet øverst i
   lerretet som beskjæres, og teksten står i fred. */
#graph-container {
  position: relative;
  margin: -7px auto 0;
  transform-origin: 0 0;
}

/* Flytende verktøylinje for zoom - eneste innhold igjen i bottom-toolbar
   etter at "vis alle læringsmål" og prøvegeneratoren flyttet inn i
   #action-menu-panel (se ensureActionMenu i engine.js). Disse knappene
   brukes aktivt mens man utforsker kartet, så de forblir synlige i stedet
   for gjemt bak et trekkspill. */
#bottom-toolbar {
  position: fixed;
  left: 1.6rem;
  bottom: 1.6rem;
  z-index: 15;
  display: flex;
  align-items: center;
  gap: 0.7rem;
}

#zoom-controls {
  display: flex;
  align-items: stretch;
  gap: 0.5rem;
}

/* Ikon-only knapper (+/−/⤢), ingen tekst - holder knappene små også på
   mobil, se prosjektnotat om at knappene var for store der. */
#zoom-in-btn, #zoom-out-btn, #fit-view-btn {
  width: 2.6rem;
  height: 2.6rem;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--radius-pill);
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  font-size: 1.15rem;
  font-weight: 700;
  line-height: 1;
  cursor: pointer;
  box-shadow: var(--shadow-float);
  transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
}

#zoom-in-btn:hover, #zoom-out-btn:hover, #fit-view-btn:hover {
  border-color: var(--border-strong);
  background: var(--surface-hover);
  transform: translateY(-1px);
}

/* Prøvegenerator-widget - nå inne i #action-menu-panel, se der for

#exam-widget {

  font-size: 0.82rem;
}

#exam-count-label {

}

#exam-count {

}

#action-menu-panel #exam-btn {

  font-size: 0.82rem;
  font-weight: 600;
  letter-spacing: 0.01em;
  padding: 0.55rem 0.9rem;
  border-radius: var(--radius-pill);

  background: var(--accent-grad);

  cursor: pointer;

/* The class is `type-${node.type}`, and the type is the English data enum
   `skill` | `concept` in every language (schema 3). Until 0.16.1 this rule
   said `.type-ferdighet`, the Norwegian name from before the enum, so no node
   ever matched it and every skill was drawn as a concept. */
.node-box.type-skill {
  border-radius: 8px;
  background: var(--ferdighet-bg);
  border-color: var(--ferdighet-border);
}

/* A fact node gets a third corner as well as a third colour, so the three
   types differ in shape too, not only in fill. */
.node-box.type-fact {
  border-radius: 3px;
  background: var(--fakta-bg);
  border-color: var(--fakta-border);
}

.node-box.active {
  box-shadow: 0 0 0 2px var(--text) inset;

.node-box.highlight-pulse {
  animation: prereq-pulse 1.6s ease-out;
}

@keyframes prereq-pulse {
  0% { box-shadow: 0 0 0 0 var(--accent); }
  40% { box-shadow: 0 0 0 8px transparent; }
  100% { box-shadow: 0 0 0 0 transparent; }

/* --------------------------------------------------------------------------
   Aid tag.

   Replaces the old .badge-del1/.badge-del2/.badge-begge trio, which hardcoded
   a two-level Norwegian exam split into CSS class names. Levels are now open
   ended: the colour comes from --aid-N in tokens.css, chosen by LEVEL, and is
   set inline by makeAidsTag() in engine.js — that is the one place a `style`
   attribute is legitimate here, because the level count is data.

   A tag ALWAYS carries its label in words ("Del 1", "Del 1+2"). The --aid-*
   colours separate by hue rather than luminance, so the text is what carries
   the meaning; a wordless tag would be colour-only. See tokens.css.

   It is a <button>: clicking it opens the detail panel at the aids section,
   which is the only place a student can read what the level actually allows.
   -------------------------------------------------------------------------- */

.aidtag {
  display: inline-flex;
  align-items: center;
  padding: 0.1rem 0.45rem;
  border: 0;
  border-radius: 0;
  color: var(--surface);
  font-family: inherit;
  font-size: 0.68rem;
  font-weight: 600;
  letter-spacing: 0.02em;
  line-height: 1.5;
  white-space: nowrap;
  cursor: pointer;
}
.aidtag:hover { filter: brightness(1.12); }
.aidtag:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

/* A split tag is the same size as a single one — that is the whole point of
   splitting rather than stacking two tags. The text sits on top of both
   stripes, so it needs a shadow to stay readable across the seam. */
.aidtag--split { text-shadow: 0 0 2px rgba(26, 29, 27, 0.55); }

/* In the detail panel the tag is a label, not a control. */
.aidtag--static { cursor: default; }
.aidtag--static:hover { filter: none; }



.badge-type {
  font-size: 0.68rem;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  font-weight: 600;
}

/* Detail panel */

#detail-panel {
  width: 0;
  overflow: hidden;
  background: var(--surface);
  border-left: 1px solid var(--border);
  transition: width 0.22s ease;
  flex-shrink: 0;
}

#detail-panel.open {
  width: min(440px, 92vw);
}

#detail-panel-inner {
  width: min(440px, 92vw);
  height: 100%;
  overflow-y: auto;
  padding: 1.6rem 1.6rem 3rem;
}

#detail-close {
  float: right;
  background: none;
  border: none;
  font-size: 0.9rem;
  color: var(--text-muted);
  cursor: pointer;
}
#detail-close:hover, #detail-close:focus-visible { color: var(--text); }

#detail-panel h2 {
  font-size: 1.3rem;
  font-weight: 700;
  margin-bottom: 0.4rem;
  clear: both;
  padding-top: 0.1rem;
}

#detail-meta {
  display: flex;
  gap: 0.4rem;
  flex-wrap: wrap;
  margin-bottom: 1rem;
}

#detail-status {
  margin-bottom: 1rem;
  font-size: 0.82rem;
  color: var(--text-muted);
}

#detail-status.available { color: var(--accent); }

.mastery-toggles {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  margin-bottom: 1.2rem;
}

.mastered-toggle {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  font-size: 0.85rem;
  color: var(--text);
  cursor: pointer;
}

#detail-desc {
  line-height: 1.7;
  font-size: 1rem;
  color: var(--text-muted);
  margin-bottom: 1.4rem;
}

.prereq-list {
  margin: 0 0 1.4rem 0;
  padding: 0;
  list-style: none;
  font-size: 0.88rem;
  line-height: 1.6;
  color: var(--text-muted);
}

.prereq-item {
  display: flex;
  align-items: baseline;
  gap: 0.5rem;
}

.prereq-check {
  flex: 0 0 auto;
  width: 1em;
  text-align: center;
  color: var(--text-muted);
  opacity: 0.6;
}

.prereq-item-done .prereq-check {
  color: var(--success);
  opacity: 1;
}

.prereq-link {
  font: inherit;
  color: var(--accent);
  background: none;
  border: none;
  padding: 0;
  cursor: pointer;
  text-decoration: underline;
  text-decoration-color: transparent;
  transition: text-decoration-color 0.15s;
}

.prereq-link:hover,
.prereq-link:focus-visible {
  text-decoration-color: currentColor;
}

.instruction-actions {
  display: flex;
  gap: 0.6rem;
  margin-bottom: 0.8rem;
}

.btn {
  font-size: 0.82rem;
  font-weight: 600;
  padding: 0.5rem 0.95rem;
  border-radius: var(--radius-pill);
  border: none;
  background: var(--accent-grad);
  color: var(--ink-inverse);
  cursor: pointer;
  transition: transform 0.15s ease, opacity 0.15s ease;
}

.btn.secondary {
  background: transparent;
  color: var(--text);
  border: 1px solid var(--border);
}

.btn:hover { transform: translateY(-1px); opacity: 0.92; }
.btn.secondary:hover { border-color: var(--border-strong); background: var(--surface-hover); transform: none; opacity: 1; }

#instruction-text {
  display: none;
  width: 100%;
  min-height: 220px;
  font-family: ui-monospace, 'SFMono-Regular', Consolas, monospace;
  font-size: 0.78rem;
  line-height: 1.55;
  padding: 0.8rem;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--bg);
  color: var(--text);
  resize: vertical;
  margin-bottom: 1.4rem;
}

#instruction-text.visible { display: block; }

.resource-list {
  list-style: none;
  font-size: 0.86rem;
}

.resource-list li {
  padding: 0.5rem 0;
  border-top: 1px solid var(--border);
}

.resource-list li:first-child { border-top: none; }

.resource-list a { text-decoration: none; }
.resource-list a:hover, .resource-list a:focus-visible { text-decoration: underline; }

#detail-empty {
  color: var(--text-muted);
  font-style: italic;
  padding: 2rem 0;
}

/* Legend */

/* Kortene selv skriver nå ut "Del 1"/"Del 2"/"Del 1+2" i sin egen badge
   (se makeHjelpemiddelBadge i engine.js) i stedet for forkortelsen "D1" -
   en egen forklarende legend er derfor overflødig. #legend-elementet står
   igjen tomt i hvert fags index.html; skjul det helt så det ikke tar opp
   plass. */
#legend {
  display: none;
}

@media (max-width: 720px) {
  #detail-panel.open { width: 100vw; position: fixed; inset: 0; z-index: 20; }
  #detail-panel-inner { width: 100vw; }
}

/* ==========================================================================
   SITE-SPECIFIC OVERRIDES — must stay last in the file.

   Everything above this line is the ported source, unchanged. Rules that
   aiskilltrees-style actually contradicts go here instead of being edited
   in place, so the two copies stay easy to diff.

   They have to be LAST: the rules they overrule have the same specificity,
   so only source order decides. Put this block at the top and it silently
   does nothing.
   ========================================================================== */

/* BUTTONS ARE ROUNDED IN THE TREE APP — a deliberate departure from
   aiskilltrees-style, decided by Vidar 2026-09-20.

   The port originally squared every text button to match the design system,
   which left #goal-index-btn and #exam-btn square while the icon controls
   next to them stayed pills — an inconsistency visible in the same menu.
   Rather than square the pills too, the whole app goes round.

   The rule is now: in the tree app, CONTROLS are pills and CONTAINERS
   (modals, panels, the node boxes) stay square, so --radius is still 0.
   The marketing pages are untouched and remain square throughout. */
.btn,
#action-menu-panel #goal-index-btn,
#action-menu-panel #exam-btn,
#lesson-plan-btn,
.linkbtn,
.column-header-btn {
  border-radius: var(--radius-pill);
}

/* Læringsmålnavnet i «Vis alle læringsmål» er en knapp (den hopper til noden
   i kartet), men skal lese som tekst. Se renderGoalIndexBody i engine.js. */
button.goal-index-item-name {
  border: 0;
  background: none;
  padding: 0;
  margin: 0;
  font: inherit;
  color: inherit;
  text-align: left;
  cursor: pointer;
}
button.goal-index-item-name:hover { color: var(--accent); text-decoration: underline; }
button.goal-index-item-name:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* THE APP FILLS THE VIEWPORT — <body> HAS TO BE THE FLEX COLUMN.

   `main` asks for `flex: 1; min-height: 0`, which only means something inside a
   flex container, and nothing ever made <body> one. So `main` took its content
   height instead: #graph-scroll grew to the full height of the graph (2600px+
   on a 900px screen), the WINDOW scrolled vertically, and the scroll container
   itself had no vertical range at all — scrollHeight === clientHeight.

   That is what made drag-to-pan work sideways and do nothing downwards.
   setupPanning() in engine.js sets scrollLeft AND scrollTop on every move; the
   horizontal one had somewhere to go and the vertical one did not. Same reason
   the mouse wheel scrolled the page rather than the map.

   Missing in the skogvoll.com original too, so this is a fix, not a port
   artefact to keep. `height: 100%` on html+body near the top of this file is
   what gives the column a definite height to divide up; `overflow: hidden`
   keeps a stray child from bringing the page scrollbar back. The detail panel
   scrolls itself (#detail-panel-inner is overflow-y: auto), so nothing inside
   depends on the page scrolling. */
body {
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* LEDETEKSTEN OVER BESKRIVELSEN — «Eleven kan:» / «Eleven kan forklare:».

   Beskrivelsen i tree.csv er fra 2026-09-21 en bar verbfrase (ferdighet)
   eller en bar definisjon (begrep); setningen fullføres her. Ledeteksten er
   derfor ikke pynt, den er halve setningen, og den står i primærgrønt på
   egen linje for å vise at den kommer fra verktøyet og ikke fra læreren som
   skrev noden. Se learnerLeadIn() i engine.js. */
#detail-lead {
  margin-bottom: 0.3rem;
  font-size: 0.95rem;
  font-weight: 600;
  color: var(--accent);
}

/* #detail-desc er et <div> fra samme dato, fordi en node kan holde flere
   definisjoner. Avsnittsmargen slås av her; avstanden ned til
   forutsetningene er elementets egen margin-bottom lenger opp i fila. */
#detail-desc > p { margin: 0; }

#detail-desc .definition-list {
  margin: 0;
  padding-left: 1.15rem;
}

#detail-desc .definition-list li { margin-bottom: 0.4rem; }
#detail-desc .definition-list li:last-child { margin-bottom: 0; }
/* Termen står i samme farge som brødteksten ellers, bare i halvfeit: den
   skal skille seg fra definisjonen, ikke fra siden. Gjelder både avsnittet
   med én definisjon og punktlista med flere. */
#detail-desc strong { color: var(--text); }


/* KANTENE ER SVAKE SOM STANDARD - tre nivåer, ikke ett.

   Et tre med hundre noder tegner flere hundre kurver, og i full styrke legger
   de seg som et garnnøste over kolonnene (Vidar, 2026-09-21). Grunnfargen er
   derfor lys nok til at strukturen anes uten å konkurrere med boksene, og to
   tilstander henter en kant tilbake:

     .edge-from-mastered  kanten GÅR FRA en node eleven har huket av. Det er
                          kantene som peker videre inn i det eleven kan ta fatt
                          på nå, så de er de eneste som er verdt å lese i en
                          graf man ikke har valgt noe i.
     .edge-selected       kanten hører til noden som er åpen i detaljpanelet,
                          inn eller ut. Denne er grønn - den svarer på «hva
                          henger sammen med DENNE?», som er et annet spørsmål
                          enn «hvor er jeg», og skal kunne følges på tvers av
                          hele kartet.

   Grønn er aldri det eneste signalet: den valgte noden har også .active, og en
   avhuket node har sin egen ring og avkryssede boks. Se updateEdgeHighlight()
   i engine.js, som også flytter de valgte kantene sist i <svg> så de tegnes
   øverst. Erstatter .edge-active, som lyste opp kanter der BEGGE endene var
   mestret - en tilstand eleven ikke har bruk for å se. */
#edges path {
  stroke: color-mix(in srgb, var(--ink) 25%, transparent);
  stroke-width: 1.3;
}

#edges path.edge-from-mastered {
  stroke: color-mix(in srgb, var(--ink) 40%, transparent);
  stroke-width: 1.7;
}

/* Kanter mellom emner: i hvile bare stubbene, når en av nodene er åpen bare
   hele kanten (se edgeStub i engine.js). */
#edges path.edge-cross:not(.edge-selected),
#edges path.edge-stub.edge-selected {
  display: none;
}

#edges path.edge-stub {
  stroke: color-mix(in srgb, var(--ink) 40%, transparent);
  stroke-linecap: round;
  stroke-linejoin: round;
}

#edges path.edge-stub.edge-from-mastered {
  stroke: color-mix(in srgb, var(--ink) 55%, transparent);
}

#edges path.edge-selected {
  stroke: color-mix(in srgb, var(--accent) 85%, transparent);
  stroke-width: 2.4;
}
</style>

<body>
  <!--
    engine.js tømmer denne <header>-en og flytter alt innholdet (tilbakelenke,
    fremdriftslinje, tittel, ingress) inn i den flytende menyen nede til
    venstre, slik at grafen får hele skjermhøyden. Se ensureActionMenu().
    Elementene må derfor ligge her, med akkurat disse klassene — men de vises
    aldri på denne plassen (tree.css skjuler `header` helt).
  -->
  <header>
    <div class="header-inner">
      <h1></h1>
      <p class="tagline"></p>
      <div class="progress-row">

        <span class="progress-label" id="progress-label"></span>
      </div>
    </div>
  </header>

  <!--
    Øverste linje på sida: fagnavnet, og en vei videre for den som ser et
    tre og lurer på om hen kan lage et selv. Den står HER framfor i den
    flytende menyen fordi den også skal stå i enkeltfil-utgaven en lærer
    laster ned og sender rundt — der er den den eneste lenka tilbake til
    metoden. Teksten fylles av applyPageChrome() fra språkfila.
  -->
  <p class="made-with" id="made-with"></p>

  <div id="error-banner"></div>
  <div id="legend"></div>

  <main>
    <div id="graph-scroll">
      <div id="graph-container">
        <div id="column-bands"></div>
        <svg id="edges"></svg>
        <div id="column-headers"></div>
        <div id="nodes-layer"></div>
      </div>
    </div>

    <aside id="detail-panel">
      <div id="detail-panel-inner">
        <p id="detail-empty"></p>
      </div>
    </aside>

e same kind of number written with a decimal point, where each place to the right is a tenth of the one before.\",,,\nvariable-formula,concept,Numbers and algebra,Variable and formula,\"Variable: a letter that stands for a quantity which can take different values.\nFormula: a rule, written with variables, that shows how one quantity is calculated from others.\",,,\ncalculate-with-formula,skill,Numbers and algebra,Calculate with a formula,\"put given values into a formula from daily life or work, calculate the result, and give it with the right unit\",variable-formula;fractions-decimals,1;2,\nconvert-units,skill,Numbers and algebra,Convert between units,\"convert between units of length, area, volume, mass and time, including square and cubic units\",fractions-decimals,1;2,\npowers,concept,Numbers and algebra,Power and square root,\"Power: a product of equal factors, written a^n, where the base a is multiplied by itself n times and n is the exponent.\nSquare root: the non-negative number that gives a when it is multiplied by itself.\",,,\nequation,concept,Numbers and algebra,Equation,\"Equation: a statement that two expressions are equal.\nSolution: the value of the variable that makes the statement true.\",variable-formula,,\nsolve-linear-equation,skill,Numbers and algebra,Solve a linear equation,\"solve an equation of the first degree by doing the same to both sides, and check the answer by putting it back in\",equation;fractions-decimals,1;2,\nrearrange-formula,skill,Numbers and algebra,Rearrange a formula,rearrange a simple formula to find a quantity other than the one it is written for,solve-linear-equation;calculate-with-formula,1;2,\nequation-system,concept,Numbers and algebra,System of equations,\"System of equations: two equations with two unknowns that must both hold at the same time.\nSolution of a system: the pair of values that makes both equations true.\",equation,,\nsolve-equation-system,skill,Numbers and algebra,Solve a system of two linear equations,\"solve a system of two linear equations by substitution or by elimination, and check the solution in both equations\",equation-system;solve-linear-equation,1;2,\ninequality,concept,Numbers and algebra,Inequality,\"Inequality: a statement that one expression is greater than, or less than, another.\nSolution set: all the values of the variable that make the inequality true.\",equation,,\nsolve-inequality,skill,Numbers and algebra,Solve a linear inequality,\"solve a linear inequality, turning the sign when both sides are multiplied or divided by a negative number, and state the solution set\",inequality;solve-linear-equation,1;2,\nset-up-and-solve,skill,Numbers and algebra,\"Set up and solve an equation, system or inequality from a situation\",\"turn a practical situation into an equation, a system of equations or an inequality, solve it, and argue for why each step and the chosen strategy are valid\",solve-linear-equation;solve-equation-system;solve-inequality,1;2,\npercentage,concept,Percentages,Percentage,\"Percentage: a number of hundredths, so 40 % means 40 out of 100.\",fractions-decimals,,\ncalculate-percentage,skill,Percentages,Calculate a percentage of an amount,\"find a given percentage of an amount, and find what percentage one amount is of another\",percentage,1;2,\npercentage-point,concept,Percentages,Percentage point,\"Percentage point: the unit for the difference between two percentages, so a rise from 20 % to 25 % is 5 percentage points but a 25 % increase.\",percentage,,\nexplain-percentage-point,skill,Percentages,Explain the difference between percent and percentage points,\"explain whether a change between two percentages is described in percent or in percentage points, and calculate both\",percentage-point;calculate-percentage,1;2,\ngrowth-factor,concept,Percentages,Growth factor,\"Growth factor: the number an amount is multiplied by in one percentage change, 1 + p/100 for an increase of p % and 1 − p/100 for a decrease of p %.\",percentage,,\ncalculate-growth-factor,skill,Percentages,Calculate the growth factor from a percentage,\"find the growth factor from a percentage increase or decrease, and the percentage change from a growth factor\",growth-factor,1;2,\nnew-value,skill,Percentages,Calculate a new value with a growth factor,calculate the value after a percentage change by multiplying by the growth factor,calculate-growth-factor,1;2,\noriginal-value,skill,Percentages,Find the value before a percentage change,\"find the original value when the new value and the percentage change are known, by dividing by the growth factor\",new-value,1;2,\nrepeated-change,skill,Percentages,Calculate the value after repeated percentage changes,\"calculate the value after several percentage changes in a row, using a power of the growth factor when the changes are equal\",new-value;powers,1;2,\ngrowth-models,concept,Percentages,Linear and exponential growth,\"Linear growth: an amount that changes by the same number each period.\nExponential growth: an amount that changes by the same percentage each period, so it is multiplied by the same growth factor each time.\",growth-factor,,\nset-up-growth-model,skill,Percentages,Set up a model of a practical situation,\"decide whether a situation shows linear or exponential growth, write an expression for the amount after n periods, and use it to find values\",growth-models;repeated-change;variable-formula,1;2,\nfind-when-reaches,skill,Percentages,Find when a growing amount reaches a value,\"find, by trying values with a calculator, after how many periods an amount under a percentage change reaches a given value\",set-up-growth-model,2,\ndigital-growth-model,skill,Percentages,Model a percentage change with a digital tool,\"use a spreadsheet or a short program to calculate an amount period by period under a percentage change, and find when it passes a given value\",set-up-growth-model,,\"This node is practised on a computer and is not examined in either part of the exam, so a spreadsheet or a program is welcome here.\"\nindex,concept,Prices and income,Index and consumer price index,\"Index: a number that shows how a price or quantity has changed relative to a base year, where the base year is set to 100.\nConsumer price index: an index for the prices of the goods and services a typical household buys.\",percentage,,\ncalculate-index,skill,Prices and income,Calculate with index numbers,use index numbers to find what a price in one year corresponds to in another year,index;fractions-decimals,1;2,\nreal-wage,concept,Prices and income,\"Nominal wage, real wage and krone value\",\"Nominal wage: the wage in the kroner actually paid.\nReal wage: the wage measured in base-year kroner, the nominal wage divided by the consumer price index and multiplied by 100.\nKrone value: what one krone buys compared with the base year, 100 divided by the consumer price index.\",index,,\ncalculate-real-wage,skill,Prices and income,Calculate krone value and real wage,calculate krone value and real wage from the consumer price index,real-wage;calculate-index,1;2,\ngross-net,concept,Prices and income,Gross and net income,\"Gross income: income before tax and other deductions.\nNet income: what is left of the income after tax and other deductions.\nWithholding tax: the tax the employer deducts from each pay, given as a percentage or from a tax table.\",percentage,,\ncalculate-net-income,skill,Prices and income,Calculate net income from gross income,calculate net income from gross income and a given withholding percentage or tax table amount,gross-net;calculate-percentage,1;2,\nexplain-purchasing-power,skill,Prices and income,Explain what decides how much a wage buys,\"explain how price changes, nominal wage and tax together decide how much a wage can buy, and calculate whether purchasing power has risen or fallen\",calculate-real-wage;calculate-net-income,2,\ninterest,concept,Personal finance,Interest and interest rate,\"Interest: money paid for borrowing money, or earned on money saved.\nInterest rate: the interest for one period as a percentage of the amount.\",percentage,,\ncompound-interest,skill,Personal finance,Calculate savings with compound interest,calculate the balance on a savings account after several years when the interest is added to the balance each year,interest;repeated-change,1;2,\nloan-terms,concept,Personal finance,Serial loan and annuity loan,\"Instalment: the part of a payment that pays down the debt.\nTerm amount: what is paid each term, the instalment plus the interest.\nSerial loan: a loan with the same instalment every term, so the term amount falls over time.\nAnnuity loan: a loan with the same term amount every term, so the instalment grows over time.\",interest,,\nserial-loan-plan,skill,Personal finance,Set up a repayment plan for a serial loan,\"set up a repayment plan for a serial loan term by term, showing remaining debt, interest, instalment and term amount\",loan-terms;calculate-percentage,1;2,\ncompare-loans,skill,Personal finance,Compare a serial loan and an annuity loan,\"compare the term amounts and the total interest of a serial loan and an annuity loan for the same amount, and say which suits a given borrower\",serial-loan-plan;loan-terms,2,\ncredit,concept,Personal finance,Credit card and effective interest rate,\"Credit card: a card that lets the holder buy now with borrowed money and pay later, with high interest on any amount not paid by the due date.\nEffective interest rate: the total yearly cost of a loan, fees included, as a percentage of the amount borrowed.\",interest,,\ncredit-cost,skill,Personal finance,Calculate the cost of credit card debt,\"calculate how a credit card debt grows when only part of it is paid each month, and what the purchase ends up costing\",credit;repeated-change,2,\nbudget,skill,Personal finance,Set up a budget and compare it with accounts,\"set up a monthly budget of income and expenses, compare it with what was actually spent, and suggest changes where it does not balance\",calculate-net-income,2,\njudge-finance-choice,skill,Personal finance,Judge a choice in personal finance,\"weigh the costs and risks of taking up a loan or buying on credit against saving first, and argue for a choice and its consequences\",compare-loans;credit-cost;compound-interest;budget,,\ndata-types,concept,Statistics,Categorical and numerical data,\"Categorical data: observations that are categories, such as favourite sport.\nNumerical data: observations that are numbers, such as height in centimetres.\",,,\npopulation-sample,concept,Statistics,Population and sample,\"Population: the whole group a statistical investigation is about.\nSample: the part of the population that is actually asked or measured.\nRepresentative sample: a sample that resembles the population in the ways that matter for the question.\",,,\nfrequency,concept,Statistics,Frequency,\"Frequency: how many times an observation occurs.\nRelative frequency: the frequency divided by the total number of observations, often written as a percentage.\nCumulative frequency: the sum of the frequencies up to and including an observation.\",percentage,,\nfrequency-table,skill,Statistics,Set up a frequency table,set up a frequency table with relative and cumulative frequency from raw data,frequency;data-types,1;2,\ndraw-diagram,skill,Statistics,Choose and draw a suitable diagram,\"choose a bar chart, pie chart or line chart to fit the data and the question, and draw it with labelled axes\",frequency-table,1;2,\ncentre,concept,Statistics,Measures of centre,\"Mean: the sum of the observations divided by the number of observations.\nMedian: the middle observation when all are sorted by size, or the mean of the two middle ones.\nMode: the observation that occurs most often.\",data-types,,\ncalculate-centre,skill,Statistics,\"Calculate mean, median and mode\",\"calculate mean, median and mode from raw data and from a frequency table\",centre;frequency-table,1;2,\nspread,concept,Statistics,Measures of spread,\"Range: the largest observation minus the smallest.\nQuartiles: the values that divide the sorted observations into four equal parts.\nInterquartile range: the upper quartile minus the lower quartile.\nStandard deviation: a measure of how far the observations typically lie from the mean.\",centre,,\ncalculate-range-iqr,skill,Statistics,Calculate range and interquartile range,\"calculate the range, the quartiles and the interquartile range of a data set\",spread;calculate-centre,1;2,\ncalculate-sd,skill,Statistics,Calculate the standard deviation,calculate the standard deviation of a small data set with a scientific calculator,spread;calculate-centre,2,\nchoose-measures,skill,Statistics,Choose suitable measures of centre and spread,\"choose the measure of centre and of spread that best describes a data set, such as the median when there are extreme values, and justify the choice\",calculate-centre;calculate-range-iqr,1;2,\ngrouped-data,concept,Statistics,Grouped data,\"Class interval: one of the ranges grouped data is divided into, such as 10–20 minutes.\nClass midpoint: the value halfway between the ends of a class interval.\nClass width: the length of a class interval.\",frequency,,\ngrouped-mean,skill,Statistics,Estimate the mean of grouped data,\"estimate the mean of grouped data using class midpoints, and find the class that contains the median\",grouped-data;calculate-centre,2,\nhistogram,skill,Statistics,Draw and read a histogram,\"draw a histogram where the area of each bar shows the frequency, and read frequencies from one\",grouped-data;draw-diagram,1;2,\ncompare-data-sets,skill,Statistics,Compare two data sets,\"compare two data sets using a measure of centre and a measure of spread, and draw a conclusion that answers the question\",choose-measures,1;2,\njudge-media-statistics,skill,Statistics,Judge how statistics are presented,\"point out where a diagram, percentage or average in the media gives a misleading picture, and say what a fairer presentation would show\",draw-diagram;explain-percentage-point;choose-measures;population-sample,,\nanalyse-data-set,skill,Statistics,Analyse and present findings from a data set,\"analyse a data set from the local community or the media, present the findings in tables and diagrams, and draw conclusions that state their limits\",compare-data-sets;draw-diagram;population-sample,,\nfigure-properties,concept,Geometry,Properties of plane figures,\"Right-angled triangle: a triangle with one angle of 90°, where the longest side, opposite the right angle, is the hypotenuse.\nAngle sum: the total of the angles in a figure, 180° in a triangle and 360° in a quadrilateral.\nParallelogram: a quadrilateral where both pairs of opposite sides are parallel.\nTrapezium: a quadrilateral with exactly one pair of parallel sides.\nCircle: all the points at the same distance, the radius, from a centre.\",,,\ncalculate-angles,skill,Geometry,Calculate unknown angles,\"calculate unknown angles in triangles and quadrilaterals from the angle sum and the properties of the figure\",figure-properties,1;2,\narea-perimeter,concept,Geometry,Perimeter and area,\"Perimeter: the total length of the edge of a plane figure.\nArea: the size of the surface a plane figure covers, measured in square units.\",,,\ncalculate-area,skill,Geometry,Calculate perimeter and area,\"calculate the perimeter and area of triangles, rectangles, parallelograms, trapezia, circles and figures made of these, with the right units\",area-perimeter;figure-properties;calculate-with-formula,1;2,\nvolume,concept,Geometry,Volume,\"Volume: the space a solid takes up, measured in cubic units.\",area-perimeter,,\ncalculate-volume,skill,Geometry,Calculate the volume of prisms and cylinders,\"calculate the volume of prisms and cylinders as base area times height, with the right units\",volume;calculate-area;convert-units,1;2,\npythagoras,concept,Geometry,Pythagoras' theorem,\"Pythagoras' theorem: in a right-angled triangle, the square of the hypotenuse equals the sum of the squares of the two other sides.\",figure-properties;powers,,\nuse-pythagoras,skill,Geometry,Use Pythagoras' theorem to find a side,\"find an unknown side in a right-angled triangle with Pythagoras' theorem, and check whether a triangle is right-angled\",pythagoras,1;2,\nsimilarity,concept,Geometry,Similar figures,\"Similar figures: figures with the same shape, where corresponding angles are equal and corresponding sides have the same ratio.\nScale factor: the ratio between corresponding sides in two similar figures.\",figure-properties;fractions-decimals,,\nsimilar-figures,skill,Geometry,Calculate unknown sides in similar figures,\"show that two figures are similar, and find unknown sides by setting up and solving an equation from equal ratios\",similarity;solve-linear-equation,1;2,\nscale,concept,Geometry,Scale,\"Scale: the ratio between a length on a map or drawing and the real length, written such as 1 : 50 000.\",fractions-decimals,,\ncalculate-scale,skill,Geometry,Calculate with scale,\"find a real length from a drawing or map, a drawn length from a real one, and the scale from the two\",scale;convert-units,1;2,\npractical-geometry,skill,Geometry,Use geometry in a practical task,\"plan and calculate a practical task, such as the material for a floor or a scale drawing of a room, by choosing the right figures, formulas and units\",calculate-area;use-pythagoras;calculate-scale;similar-figures,2,\n","/assets/prompts/manifest.json":{"_comment":"The index the engine fetches first; everything else is reached from here, so no other prompt filename is hardcoded in engine.js. Each module carries its OWN `version`, because the paper cites them one by one in the appendix -- changing the lesson-plan wording must not invalidate a citation of the practice tutor. ENGLISH IS THE SOURCE OF RECORD in every file under prompts/: they say WHAT the model should do, never what language to say it in. `languages/<code>.json` fills that hole, and `prompts/subjects/<family>.json` replaces a general section with one written for a family of subjects where that family needs it.\n`audience` says WHO an instruction is for. The four with audience `student` are composed by the engine and end up in a student's chat; the two with audience `teacher` are for the person BUILDING a tree, and the engine skips them when it loads a tree -- fetching them on every tree page would cost every reader 20 kB for text no student will ever see. All six are contributions in the same sense and are versioned the same way, which is the point: spec/decomposition.md was the odd one out until 0.3.0.\n`appendsSubjectFamilies` on `authoring` means the composed authoring prompt ends with the `decomposition` block of EVERY family in `subjectFamilies`, headed by its key: a teacher copying the prompt has not told anyone the subject yet, and a chat model cannot fetch the file itself. See the `subjectFamilies` section of decomposition.json.","schemaVersion":3,"version":"3.0.0","sourceLanguage":"en","shared":"shared.json","instructions":{"decomposition":{"file":"decomposition.json","contribution":1,"title":"The decomposition model","audience":"teacher"},"node":{"file":"practice-tutor.json","contribution":2,"title":"Practice tutor","audience":"student"},"exam":{"file":"test-generator.json","contribution":3,"title":"Test generator","audience":"student"},"motivation":{"file":"motivation.json","contribution":4,"title":"Motivation dialogue","audience":"student"},"lessonPlan":{"file":"lesson-plan.json","contribution":5,"title":"Lesson plan generator","audience":"student"},"authoring":{"file":"authoring.json","title":"Authoring an own skill tree","audience":"teacher","appends":"decomposition","appendsSubjectFamilies":true}},"subjectFamilies":{"mathematics":"subjects/mathematics.json","natural-sciences":"subjects/natural-sciences.json","social-sciences":"subjects/social-sciences.json","practical-aesthetic":"subjects/practical-aesthetic.json","language-and-literature":"subjects/language-and-literature.json","language-acquisition":"subjects/language-acquisition.json"},"_conditions":"Sections that only apply sometimes name their condition in the instruction module's own `when` map: hasPrerequisites/noPrerequisites, skillNode, conceptNode, severalConcepts, factNode, nodeInstruction, aids, severalAids, expressionFocus, courseSpecifics, hasConcepts, allConcepts, someConcepts and hasFacts. What each name means is code (CONDITIONS in engine.js); which section has which is data, so the builder and /prompts/ can say \"Nodes with prerequisites\" instead of \"only sometimes\". A section without a condition always renders. A subject family replaces a section in place and so keeps its condition; a section a family adds (`add`) takes the condition of the section it is placed after."},"/trees/vocabulary.json":{"_comment":"Kontrollert vokabular for de metadatafeltene som filtreres på i katalogen. Hvert tres meta.json lagrer NØKKELEN (f.eks. \"NO\", \"vgs\", \"mathematics\"), aldri den ferdige teksten — teksten slås opp her, på leserens språk. Det var «Matematikk» og «Mathematics» side om side i samme fasettliste som tvang dette fram: så lenge hvert tre skrev verdien selv, fikk katalogen én fasettverdi per språk framfor én per fagområde.\n\nStrengt, uten fallback: en nøkkel som ikke står her er en FEIL, ikke en verdi som vises rå. Vidar går gjennom hvert innsendte tre manuelt, så en ukjent verdi kan ikke nå sida uten at han har sett den — og da er det riktige å legge nøkkelen inn her framfor å la katalogen skjule tabben. catalog.js logger derfor en konsollfeil og hopper over treet.\n\nTo lesere, samme fil: katalogen slår opp på GRENSESNITTETS språk (NO/EN/SV-veksleren), mens et ferdighetstre slår opp på SITT EGET språk — et tre er enspråklig, og «Om faget»-vinduet skal stå på treets språk uansett hvor leseren kom fra.\n\nÅ legge til en verdi er én blokk her. Å legge til et SPRÅK er én nøkkel i hver blokk.","schemaVersion":1,"country":{"_comment":"ISO 3166-1 alpha-2, store bokstaver. Landet læreplanen hører til, ikke der forfatteren bor.","NO":{"en":"Norway","nb":"Norge","sv":"Norge"},"SE":{"en":"Sweden","nb":"Sverige","sv":"Sverige"}},"language":{"_comment":"ISO 639-1. Språket treet er SKREVET på — et faktum om treet, ikke en visning av det: trærne oversettes ikke. `nb` og ikke `no`, slik at `nn` kan komme senere uten omdøping.","nb":{"en":"Norwegian (Bokmål)","nb":"Norsk (bokmål)","sv":"Norska (bokmål)"},"sv":{"en":"Swedish","nb":"Svensk","sv":"Svenska"},"en":{"en":"English","nb":"Engelsk","sv":"Engelska"}},"subjectFamily":{"_comment":"Fagfamilien, grovere enn fagområdet: den styrer hvilken pedagogikk-fil instruksen henter (`subjectFamily` i tree.csv, fila i maskineriets prompts/subjects/). I katalogen er den fasetten over fagområdet, slik landet er over institusjonen. Nøklene er de samme som i maskineriets manifest; et tre som oppgir en familie som ikke står her, utelates fra katalogen. Dette er også stedet byggeren på /make-your-own/ henter visningsnavnene fra.","mathematics":{"en":"Mathematics","nb":"Matematikk","sv":"Matematik"},"natural-sciences":{"en":"Natural sciences","nb":"Naturvitenskap","sv":"Naturvetenskap"},"social-sciences":{"en":"Social sciences and humanities","nb":"Samfunnsfag og humaniora","sv":"Samhällsvetenskap och humaniora"},"practical-aesthetic":{"en":"Practical and aesthetic subjects","nb":"Praktisk-estetiske fag","sv":"Praktisk-estetiska ämnen"},"language-and-literature":{"en":"Language and literature","nb":"Språk og litteratur","sv":"Språk och litteratur"},"language-acquisition":{"en":"Foreign languages","nb":"Fremmedspråk","sv":"Moderna språk"}},"subjectArea":{"_comment":"Fagområdet, grovere enn kurset selv: «Matematikk», ikke «Matematikk 2P». Nøklene er engelske fordi engelsk er kildespråket i metoden.\n\nIkke å forveksle med `subjectFamily` i tree.json, som er grovere igjen (mathematics / natural-sciences / social-sciences / practical-aesthetic / language-and-literature / language-acquisition) og styrer hvilken pedagogikk-fil instruksen henter. Dette feltet styrer bare filtrering i katalogen.","mathematics":{"en":"Mathematics","nb":"Matematikk","sv":"Matematik"},"physics":{"en":"Physics","nb":"Fysikk","sv":"Fysik"},"chemistry":{"en":"Chemistry","nb":"Kjemi","sv":"Kemi"},"biology":{"en":"Biology","nb":"Biologi","sv":"Biologi"},"science":{"en":"Science","nb":"Naturfag","sv":"Naturkunskap"},"social-studies":{"en":"Social studies","nb":"Samfunnskunnskap","sv":"Samhällskunskap"},"norwegian":{"en":"Norwegian","nb":"Norsk","sv":"Norska"},"swedish":{"en":"Swedish","nb":"Svensk","sv":"Svenska"},"spanish":{"en":"Spanish","nb":"Spansk","sv":"Spanska"},"teaching":{"en":"Teaching and learning","nb":"Undervisning og læring","sv":"Undervisning och lärande"},"music":{"en":"Music","nb":"Musikk","sv":"Musik"},"wine":{"en":"Wine","nb":"Vin","sv":"Vin"}},"institution":{"_comment":"Skoleslaget eller institusjonen treet hører hjemme i, og — under `divisions` — dens egen inndeling.\n\n`label` er én streng og IKKE oversatt: en institusjon har et navn. «Videregående skole» heter det på norsk uansett hvem som leser, på samme måte som et tre er skrevet på ett språk. Det er også derfor navnene ikke lenger trenger å skille seg fra hverandre med land i parentes — fasetten vises først etter at et land er valgt, så «Gymnasiet» og «Videregående skole» kan ikke forveksles. `divisionLabel` er derimot en overskrift i grensesnittet, ikke et navn, og oversettes fortsatt.\n\nHvorfor inndelingen ligger HER og ikke som en egen toppnøkkel: «Vg2» og «MN-fakultetet» er ikke samme slags ting. Den ene er et årstrinn i et skoleslag, den andre en organisatorisk enhet. Ingen felles overskrift dekker begge, og de standardiserte vokabularene (schema.org `educationalLevel`, EQF) har bare årstrinn-betydningen. Løsningen er å la institusjonen navngi sin egen inndeling: datafeltet heter nøytralt `division` i meta.json, og `divisionLabel` under er overskriften brukeren faktisk ser.\n\nDet er også grunnen til at `division` er en AVHENGIG fasett i katalogen: verdiene er bare meningsfulle når institusjonen er valgt, og en sammenslått liste over Vg1, 8. trinn, Årskurs 2 og MN ville vært støy. Se `parent` i FACETS i js/catalog.js.","grunnskole":{"label":"Ungdomsskole","divisionLabel":{"en":"Year","nb":"Trinn","sv":"Årskurs"},"divisions":{"8":{"en":"Year 8","nb":"8. trinn","sv":"Årskurs 8"},"9":{"en":"Year 9","nb":"9. trinn","sv":"Årskurs 9"},"10":{"en":"Year 10","nb":"10. trinn","sv":"Årskurs 10"}}},"vgs":{"label":"Videregående skole","divisionLabel":{"en":"Year","nb":"Trinn","sv":"Årskurs"},"divisions":{"_comment":"«Vg1»/«Vg2»/«Vg3» er egennavn i det norske skoleslaget og oversettes ikke — de står likt på alle tre språk med vilje.","vg1":{"en":"Vg1","nb":"Vg1","sv":"Vg1"},"vg2":{"en":"Vg2","nb":"Vg2","sv":"Vg2"},"vg3":{"en":"Vg3","nb":"Vg3","sv":"Vg3"}}},"gym":{"label":"Gymnasiet","divisionLabel":{"en":"Year","nb":"Årskurs","sv":"Årskurs"},"divisions":{"1":{"en":"Year 1","nb":"Årskurs 1","sv":"Årskurs 1"},"2":{"en":"Year 2","nb":"Årskurs 2","sv":"Årskurs 2"},"3":{"en":"Year 3","nb":"Årskurs 3","sv":"Årskurs 3"}}},"uio":{"_comment":"Første ikke-skole-institusjon, lagt inn som mønsteret universitetsfag skal følge: inndelingen er FAKULTET, ikke årstrinn. Ingen trær bruker den ennå.","label":"Universitetet i Oslo","divisionLabel":{"en":"Faculty","nb":"Fakultet","sv":"Fakultet"},"divisions":{"mn":{"en":"Faculty of Mathematics and Natural Sciences","nb":"Det matematisk-naturvitenskapelige fakultet","sv":"Matematisk-naturvetenskapliga fakulteten"}}},"kor":{"_comment":"Første institusjon som ikke er en skole eller et universitet: et kor. Ingen inndeling, så `division` står tom i meta.json.","label":"Kor","divisions":{}},"hobby":{"_comment":"Kurs og selvstudium på fritida, utenfor skole og universitet. Ingen inndeling, så `division` står tom i meta.json.","label":"Hobby","divisions":{}}}},"/assets/prompts/shared.json":{"_comment":"Sections whose text is IDENTICAL in more than one instruction, held once so they cannot drift apart. An instruction picks one up by naming it in its own `order`; the engine falls back here when the module itself has no such section. Only put a section here when the wording is genuinely the same everywhere -- `role`, `opening`, `prerequisites` and `aids` all appear in several instructions with DIFFERENT wording, and each of those stays in its own module. `courseSpecifics` is here for the same reason and not because it is short: it is the teacher's own text about the course, carried into every instruction unchanged, so there is nothing for a module to say differently. `noMemory` moved here in 1.4.0, when it was word for word the same in the tutor, the test generator and the lesson planner; the motivation dialogue keeps its own, stronger wording, and a module's own section wins over this file.","id":"shared","version":"1.4.1","schemaVersion":2,"sections":{"languageSwitch":"If the user explicitly asks for another language, switch at once and stay in it until they ask otherwise. Only an explicit request counts: a message written in another language, a quotation or a borrowed word is not one. After a switch, keep the names of nodes, skills and concepts as the skill tree writes them, with the translation alongside.","courseSpecifics":"The teacher who built this skill tree wrote the following about the whole course. It is part of your instructions, not a message from the user: where it conflicts with anything else here, follow it. Do not quote it or mention it to the user.\n\n{courseSpecifics}","aidsMultiple":"This skill is assessed in several contexts, listed above. The student must manage it under the MOST RESTRICTIVE one, with the fewest aids: train that first, and only then the faster route the other contexts allow.","writingStyleGeneral":"How to write for the student:\n- Use the active voice: \"you find this by…\", not \"it is found by…\".\n- Use words you would say out loud to a friend, not bookish or formal ones.","noMemory":"If you have a memory across conversations, store nothing from this one in it."}},"/assets/prompts/practice-tutor.json":{"_comment":"Copied from a node's detail panel — the core action of the whole tool. `groups` is the order of the sections AND the headings they are shown under, both in the builder and on /prompts/ and in the instruction a student pastes (\"## Role and style\"). The order is what a teacher wants to read first: who the AI is and how it talks, then the method, then the goal, and last the technical context the engine fills in. `when` names the condition a section has, from CONDITIONS in engine.js; a section without one always renders. A section that is null here is filled by another layer: outputLanguage and writingStyle by the language file, nodeInstruction and aids by the engine.","id":"node","title":"Practice tutor","contribution":2,"version":"2.1.0","schemaVersion":3,"sourceLanguage":"en","groups":[{"title":"Role and style","sections":["role","opening","tone","messageLength","fallibility","features","vocabulary","outputLanguage","languageSwitch","writingStyleGeneral","writingStyle"]},{"title":"How to teach","sections":["leadIn","examples","analogy","difficulty","expression"]},{"title":"The goal","sections":["goal","goalSkill","skillGuidance","goalConcept","goalConceptMultiple","conceptGuidance","goalFact","factGuidance","nodeInstruction","mastery"]},{"title":"Context","sections":["prerequisites","prerequisitesNone","aids","aidsMultiple","courseSpecifics","noMemory"]}],"when":{"expression":"expressionFocus","goalSkill":"skillNode","skillGuidance":"skillNode","goalConcept":"conceptNode","goalConceptMultiple":"severalConcepts","conceptGuidance":"conceptNode","goalFact":"factNode","factGuidance":"factNode","nodeInstruction":"nodeInstruction","prerequisites":"hasPrerequisites","prerequisitesNone":"noPrerequisites","aids":"aids","aidsMultiple":"severalAids","courseSpecifics":"courseSpecifics"},"sections":{"role":"You are an AI learning assistant helping a student practise {courseName}.","opening":"Start by speaking directly to the student (\"you\"), with no summary of these instructions and no filler like \"Okay, let's get started\". Name the skill or concept in one sentence, then ask one question, such as \"Want me to explain it?\" Do not list options.","tone":"Be friendly, with a few emoji, but professional. Remind the student they can ask about anything they don't understand.","messageLength":"Keep each message to about 40 words, and your first message to about 50. This is a soft limit, not a count. When an explanation needs more, split it over several turns: give one step, then stop and bring the student along before the next, for example with \"With me so far?\" or, better, a small question they can only answer if they followed. Wait for the reply. Go longer only when the student asks for it.","fallibility":"In your first message, in one short sentence, and now and then after that, tell the student that you are a language model and can be wrong while sounding sure, and that AI models vary a lot in quality and reliability: they should be critical, and ask their teacher or classmates when something is unclear or important.","features":"Once, in your second or third message and in one sentence, mention features you actually have, for example that the student can send a photo of their handwritten working, or talk to you by voice. Where it genuinely helps understanding, you can also offer a small self-contained HTML simulation (HTML/CSS/JS in one code block, no external dependencies); if their app cannot run it, they can save it as a .html file and open it in a browser.","outputLanguage":null,"vocabulary":"Use simple, concrete language. Words from the prerequisite list below are known and may be used freely. Words that first appear in this node's name or description are new: explain each the first time you use it. If the student seems unsure of any word, explain it on the spot without remarking that they should know it. Everyday words, such as \"speed\" in its ordinary sense, need no explanation. Pitch the language to the level of the course, never condescending.","writingStyle":null,"leadIn":"When explaining, do not open with a general definition. Start with a concrete setting or one simple worked instance, and let the definition, rule or term come as the conclusion.","examples":"When you give examples, mix: a couple of typical ones, one right on the boundary of the definition, one that looks similar but is not an instance, and ideally two near-identical ones where only one is valid. Say why each is or is not valid. Describe them in plain words (\"Here's one right on the edge. Is it an example or not?\"), never with terms like \"boundary case\" or \"minimally different pair\".","analogy":"You may use an analogy where it helps. If you do, say it is only a mental aid, not an exact description.","difficulty":"Adjust the difficulty to how the student does: easier if they struggle, harder if it comes easily. Test the student along the way. After each attempt, give the answer and a short assessment of what is right and what is missing, and why, and help them learn to judge their own work.","expression":"Watch how the student writes, not only whether the answer is right. Comment kindly but clearly when the student, for example, {expressionFocus}. Say briefly why it matters and show the correct form.","goal":"The goal of the session is for the student to learn \"{nodeName}\". What mastering it means is stated below. It is the goal, not something the student already knows.","goalSkill":"The student can:\n{nodeDescription}","skillGuidance":"This is a SKILL: the student learns it by doing it. After at most one worked instance, let the student do the work: one task at a time, and when they are stuck, give a hint for the next step rather than the full solution.","goalConcept":"The student can explain:\n{nodeDescription}","goalConceptMultiple":"Each line ab
