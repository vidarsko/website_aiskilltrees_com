<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!--
    ===================================================================
    ENKELTFIL-UTGAVEN av et ferdighetstre.

    Denne fila er hele treet: motoren, stilene, instruksene, språkfila og
    selve treet ligger inne i den. Den henter ingenting, og virker derfor
    ved dobbeltklikk, uten nett og uten server.

    DET ER IKKE EN FINESSE, DET ER DET ENESTE SOM VIRKER. En side åpnet
    fra disk får opphavet `null` i nettleseren, og en side uten opphav får
    ikke lese filer ved siden av seg - `fetch()` blokkeres av CORS. En
    <script>-tagg blokkeres derimot ikke, fordi den ikke gir sida lesbare
    data, den kjører kode. Derfor kommer treet inn som `AIST_BUNDLE`
    nedenfor, altså som kode framfor som en fil som blir lest.

    KILDEFILA DI LIGGER I FILA. Regnearket står ordrett i AIST_BUNDLE
    under nøkkelen "tree.csv". Mister du CSV-en, kan du hente den ut
    derfra - denne fila er sin egen kilde.

    TILBAKELENKA ER FJERNET med vilje: dette treet ligger ikke i en
    katalog, og en lenke til et nettsted er verdiløs i en fil som nettopp
    er laget for å virke uten nett.

    Laget av byggeren på aiskilltrees.com/make-your-own/. Vil du endre
    treet, rediger regnearket og bygg en ny fil der; denne er med vilje
    skrivebeskyttet, slik at den er trygg å dele videre til en klasse.
    ===================================================================
  -->
  <title>AI Skill Trees</title>
  <meta name="description" content="">

  <style>/* ==========================================================================
   engine/tokens.css — the engine's DEFAULT palette and type.

   Why this file exists
   --------------------
   `tree.css` styles the graph entirely through custom properties, and until
   this file was written every one of them was defined by the website that
   happened to host it. The engine therefore could not render anywhere else:
   dropped into a folder on a teacher's laptop it came out unstyled, because
   `--paper`, `--ink`, `--primary` and the rest lived in the site's own
   `tokens.css`.

   This file inverts that. The engine now ships a complete, working palette,
   and a host site overrides whichever values it wants by loading its own
   token file AFTER this one. The values below are the ones aiskilltrees.com
   used when the engine was extracted, so nothing changed visually on that
   site — it simply stopped being the only place the engine works.

   Load order on a page that renders a tree:

       engine/tokens.css     <- defaults (this file)
       <host tokens, if any> <- optional overrides, later wins
       engine/tree.css       <- consumes the tokens

   Contrast: every pairing below was checked against its background at AA or
   better. If you override a colour, check it again — the graph puts small
   text on tinted fills in several places.
   ========================================================================== */

:root {
  /* ---- Surfaces and ink ------------------------------------------------- */
  --paper:         #F6F4EF;
  --paper-2:       #EDEAE2;
  --surface:       #FFFFFF;
  --ink:           #1A1D1B;
  --ink-3:         #646964;
  --ink-inverse:   #F6F4EF;

  /* ---- Rules and scrim -------------------------------------------------- */
  --rule:          rgba(26, 29, 27, 0.14);
  --rule-strong:   rgba(26, 29, 27, 0.30);
  --scrim:         rgba(26, 29, 27, 0.62);

  /* ---- Primary ---------------------------------------------------------- */
  --primary:        #1F6F4A;
  --primary-strong: #16543A;
  --primary-tint:   #E3EFE8;

  /* ---- Secondary accent, used for the "skill" node fill ----------------- */
  --amber:         #C8801F;
  --amber-tint:    #F7EBD9;

  /* ---- Destructive ------------------------------------------------------ */
  --danger:        #C2362F;
  --danger-text:   #A32B24;
  --danger-tint:   rgba(194, 54, 47, 0.10);

  /* ---- Aid levels -------------------------------------------------------
     Read from JavaScript, not from tree.css: engine.js composes
     `var(--aid-N)` for the tag on a node, so these have to exist even
     though a search of the stylesheet will not find them.

     The colour is bound to the LEVEL, never to the subject: level 1 is
     always --aid-1. Five are defined and the sequence wraps, so a course
     with six levels reuses the first colour rather than falling back to
     nothing. They differ in hue rather than lightness, which is why the tag
     always carries a word as well — colour alone never carries meaning.
     Each is AA or better against white text. */
  --aid-1: #1F6F4A;   /* 6.12:1 */
  --aid-2: #8A5A12;   /* 5.91:1 */
  --aid-3: #1F5F7A;   /* 7.06:1 */
  --aid-4: #5B3D8A;   /* 8.47:1 */
  --aid-5: #8A2B4A;   /* 9.30:1 */

  /* ---- Elevation --------------------------------------------------------
     A deliberate, narrow exception to a flat design: the floating toolbar
     and the modals sit above a scrolling canvas and need real height. */
  --shadow-float: 0 4px 14px rgba(26, 29, 27, 0.18);
  --shadow-modal: 0 12px 40px rgba(26, 29, 27, 0.28);

  /* ---- Type -------------------------------------------------------------
     A stack of system faces, so the engine has no webfont dependency and
     works offline from a folder. A host site that wants its own face
     overrides this one line. */
  --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
}

/* ==========================================================================
   tokens.css — the single source of truth for color, type and spacing.
   Design system: aiskilltrees-style v1.3
   (canonical: ../.claude/skills/aiskilltrees-style/SKILL.md in the umbrella repo)

   NO other stylesheet and NO page may hardcode a hex value or a font stack.
   If a value is missing, add a token here — that is what keeps the palette
   one variable to change rather than a find-and-replace across the site.
   ========================================================================== */

@import url("fonts.css");   /* self-hosted since 2026-09-26 — see css/fonts.css */

:root {
  /* ---- Grounds ---------------------------------------------------------- */
  --paper:         #F6F4EF;   /* default page ground — warm off-white */
  --paper-2:       #EDEAE2;   /* alternate band, one step deeper */
  --surface:       #FFFFFF;   /* cards, tables, the graph canvas */

  /* ---- Ink -------------------------------------------------------------- */
  --ink:           #1A1D1B;   /* primary text, and the dark band ground — 15.5:1 on --paper */
  --ink-2:         #4A4F4B;   /* secondary text — 7.6:1 on --paper */
  --ink-3:         #646964;   /* muted: captions, metadata — 5.1:1 on --paper */
  --ink-inverse:   #F6F4EF;   /* text on --ink and --primary bands */
  --rule:          rgba(26, 29, 27, 0.14);   /* hairline separators inside a band */
  --rule-inverse:  rgba(246, 244, 239, 0.22);

  /* ---- Primary ---------------------------------------------------------- */
  --primary:        #1F6F4A;  /* deep evergreen — 6.1:1 on white, 5.6:1 on --paper */
  --primary-strong: #16543A;  /* hover/active — 8.9:1 on white */
  --primary-tint:   #E3EFE8;  /* pale band fill */

  /* ---- Signal (graph states; emphasis used sparingly) ------------------- */
  --amber:         #C8801F;   /* fills and marks only — 5.3:1 against --ink */
  --amber-text:    #8A5A12;   /* the same signal as words — 5.4:1 on --paper */
  --amber-tint:    #F7EBD9;

  /* ---- Rules and elevation ----------------------------------------------
     --rule-strong is the hairline at hover/active strength.
     The two shadows exist ONLY for the skill-tree app: its floating toolbar
     and its modals sit above a scrolling graph canvas and need real
     elevation. The design system's "no shadows" rule is about cards on a
     band ground and still holds everywhere else — do not reach for these on
     a marketing page. */
  --rule-strong:   rgba(26, 29, 27, 0.30);
  --shadow-float:  0 4px 14px rgba(26, 29, 27, 0.18);
  --shadow-modal:  0 12px 40px rgba(26, 29, 27, 0.28);

  /* ---- Danger ------------------------------------------------------------
     Validation errors in the skill-tree app (a malformed CSV, a cycle in the
     graph). --danger is the fill/rule; --danger-text is the same signal as
     words — 5.9:1 on --paper. */
  --danger:        #C2362F;
  --danger-text:   #A32B24;
  --danger-tint:   rgba(194, 54, 47, 0.10);

  /* ---- Aid levels --------------------------------------------------------
     An ORDERED palette for the `aids` column. A subject picks LEVELS, never
     colours: level 1 always gets --aid-1, level 2 --aid-2, and so on. That is
     what keeps a Norwegian «Del 1» and an IB «Paper 1» the same colour, and
     what keeps hex values out of a tree's own files.

     Levels 1 and 2 are deliberately the old --del1/--del2 values, so the 2P
     tree looks exactly as it did.

     All five carry WHITE text at AA for small text (measured, not guessed):
     6.12, 5.91, 7.06, 8.47 and 9.30 : 1. They separate by HUE, not by
     luminance — which is safe here only because an aid tag always carries its
     label in words. Never ship a wordless aid tag. */
  --aid-1: #1F6F4A;   /* evergreen — 6.12:1 on white */
  --aid-2: #8A5A12;   /* amber-brown — 5.91:1 */
  --aid-3: #2A5C86;   /* deep blue — 7.06:1 */
  --aid-4: #6E3A6B;   /* plum — 8.47:1 */
  --aid-5: #7A2E2E;   /* brick — 9.30:1 */

  /* ---- Scrim ------------------------------------------------------------
     A FLAT overlay, not a gradient: the system has no gradients, and a
     photograph still has to be dimmed before display type can sit on it. */
  --scrim:         rgba(26, 29, 27, 0.62);

  /* ---- Type ------------------------------------------------------------- */
  --font-sans:  "Inter", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  --font-serif: "Charis SIL", "Source Serif 4", Georgia, serif;

  --step-xs:  0.875rem;                                       /* 14px — captions, metadata */
  --step-s:   1rem;                                           /* 16px — UI, labels */
  --step-m:   clamp(1.0625rem, 0.5vw + 0.95rem, 1.1875rem);   /* 17→19px — body prose */
  --step-l:   clamp(1.375rem, 1vw + 1.1rem, 1.75rem);         /* 22→28px — h3 */
  --step-xl:  clamp(1.75rem, 2vw + 1.25rem, 2.5rem);          /* 28→40px — h2 */
  --step-2xl: clamp(2.25rem, 4.5vw + 1rem, 3.75rem);          /* 36→60px — h1 */
  --step-3xl: clamp(2.75rem, 7vw + 0.5rem, 5.5rem);           /* 44→88px — hero only */

  /* ---- Spacing and measures -------------------------------------------- */
  --gutter:        clamp(1.25rem, 5vw, 4rem);   /* 20px phone → 64px desktop, INSIDE bands */
  --space-band:    clamp(3rem, 8vw, 7rem);      /* vertical padding of a band */
  --space-band-lg: clamp(4.5rem, 12vw, 10rem);  /* hero and closing CTA only */
  --measure-prose: 68ch;
  --measure-wide:  1280px;

  --space-1: 0.5rem;
  --space-2: 1rem;
  --space-3: 1.5rem;
  --space-4: 2rem;
  --space-5: 3rem;
  --space-6: 4rem;
}

/* ==========================================================================
   tree.css — the skill-tree graph app (the view at /trees/<slug>/).

   PORTED from skogvoll.com's ferdighetstre/style.css, 2026-09-19. Everything
   below the bridge is that file verbatim: the layout, the detail panel, the
   floating toolbar and every tuning comment in it are the result of a lot of
   iteration and are NOT to be re-derived here. What changed on the way over is
   this header, and the override block at the very BOTTOM of the file.

   The bridge below re-expresses the names that file uses (--bg, --accent,
   --text, --radius ...) in terms of aiskilltrees-style tokens, so the app
   inherits this site's palette without touching 1000 lines of tuned CSS. If a
   value looks wrong on this site, fix it HERE, in the bridge — or, when a
   single rule rather than a color needs to change, in the override block at
   the bottom. Editing a rule in the body would make the two copies diverge
   for no reason, and makes the next port harder than it needs to be.

   The page loads tokens.css and then this file, and NOT base.css: base.css
   carries the band model and prose defaults for the marketing pages, which
   would fight the app's own layout. That means the small reset below has to
   live here.

   Design system: aiskilltrees-style v1.0. No hardcoded hex values, no font
   stacks — every color below resolves to a token in tokens.css.
   ========================================================================== */

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  /* ---- Bridge: engine token name → aiskilltrees token --------------------- */
  --bg:            var(--paper);
  --surface-hover: var(--paper-2);
  --border:        var(--rule);
  --border-strong: var(--rule-strong);
  --text:          var(--ink);
  --text-muted:    var(--ink-3);
  --accent:        var(--primary);

  /* The source system used a gradient here. aiskilltrees-style has no
     gradients at all, so the "gradient" is a flat primary fill. */
  --accent-grad:   var(--primary);

  /* "Mastered" in the graph is the primary green, per the design system's
     note on the skill-tree graph. State is never carried by color alone —
     a mastered node also gets an inset ring and a checked box. */
  --success:       var(--primary);
  --danger-soft:   var(--danger-text);

  /* Square corners are the system's rule. --radius-pill stays round: it is
     only used on circular icon buttons (zoom, menu, help), which are controls,
     not page-level containers. */
  --radius:        0;
  --radius-sm:     0;
  --radius-pill:   9999px;

  /* ---- Node types --------------------------------------------------------
     Begrep (a concept) and ferdighet (a skill) are told apart by fill and by
     the label on the node itself, never by fill alone. Both fills are pale
     tints so that the edge lines behind a node never read through the card. */
  --begrep-bg:        var(--primary-tint);
  --begrep-border:    color-mix(in srgb, var(--primary) 55%, transparent);

  --ferdighet-bg:     var(--amber-tint);
  --ferdighet-border: color-mix(in srgb, var(--amber) 60%, transparent);

  --locked-opacity: 0.45;

  --column-alt: color-mix(in srgb, var(--ink) 4%, transparent);

}

body { font-family: var(--font-sans); }


html, body { height: 100%; }

a { color: var(--accent); }

/* Den opprinnelige <header> er tømt av ensureActionMenu() (se engine.js) -
   ALT innholdet dens (tilbake-lenke, dag/natt-knapp, fremdriftslinje,
   tittel, undertekst) flyttes inn i #action-menu-panel, slik at grafen kan
   fylle hele skjermhøyden. Skjules derfor unconditionally her i CSS (ikke
   bare via JS) for å unngå et glimt av den gamle headeren før JS rekker å
   flytte innholdet. */
header {
  display: none;
}

/* The source page had a light/dark toggle. aiskilltrees-style has no dark
   mode in v1 and this page ships no toggle button, so those rules are gone.
   engine.js looks the button up with querySelector and tolerates its
   absence (see ensureActionMenu), so nothing else had to change. */

.back-link {
  display: inline-block;
  font-size: 0.85rem;
  color: var(--text-muted);
  text-decoration: none;
  border-bottom: 1px solid transparent;
  transition: border-color 0.2s, color 0.2s;
}

.back-link:hover, .back-link:focus-visible {
  color: var(--accent);
  border-bottom-color: var(--accent);
}

/* Meny-knapp nederst til venstre, til venstre for zoom-knappene i
   #bottom-toolbar (se setupZoom/getBottomToolbar i engine.js) - IKKE øverst
   til høyre, siden den da nesten overlappet tilbake-knappen i detaljpanelet
   når det er åpent på mobil (begge endte i samme hjørne). Slår ut
   #action-menu-panel, som ensureActionMenu() (engine.js) fyller med ALT som
   før lå i headeren: tilbake-lenke + dag/natt-knapp (#menu-nav-row),
   fremdriftslinje, tittel/undertekst, og til slutt de sjeldnere brukte
   knappene (læringsmål-liste, prøvegenerator, motivasjon). Selve #menu-wrap
   er bare et ankerpunkt for panelet - #bottom-toolbar (fixed) gir selve den
   flytende posisjoneringen.

   Fra 2026-09-20 ligger OGSÅ «?»-knappen og «Om faget» inne i panelet.
   Verktøylinjen har da bare burgeren og zoom-kontrollene, og burgeren er
   gjort litt større enn dem: den åpner alt det andre, så den skal lese som
   hovedknappen framfor som én av fire like. */
#menu-wrap {
  position: relative;
}

/* Bevisst større enn zoom-knappene (2,6rem) og svakt grønn: dette er
   inngangen til alt annet på sida, og den eneste knappen en ny bruker MÅ
   finne. Tinten er --primary-tint, systemets bleke grønn — nok til å skille
   den fra de nøytrale zoom-knappene, ikke nok til å lese som en CTA. */
#menu-toggle-btn {
  width: 3.5rem;
  height: 3.5rem;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--radius-pill);
  border: 1px solid color-mix(in srgb, var(--primary) 28%, transparent);
  background: var(--primary-tint);
  color: var(--primary-strong);
  cursor: pointer;
  box-shadow: var(--shadow-float);
  transition: background 0.15s ease, border-color 0.15s ease;
}

#menu-toggle-btn svg { width: 24px; height: 24px; }

#menu-toggle-btn:hover, #menu-toggle-btn[aria-expanded="true"] {
  border-color: color-mix(in srgb, var(--primary) 55%, transparent);
  background: color-mix(in srgb, var(--primary) 16%, var(--surface));
}

#action-menu-panel {
  display: none;
  flex-direction: column;
  gap: 0.6rem;
  position: absolute;
  bottom: calc(100% + 0.5rem);
  left: 0;
  z-index: 30;
  width: min(320px, calc(100vw - 2.4rem));
  max-height: calc(100vh - 5rem);
  overflow-y: auto;
  padding: 0.8rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-modal);
}

#action-menu-panel.open { display: flex; }

#menu-nav-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.8rem;
  padding-bottom: 0.6rem;
  border-bottom: 1px solid var(--border);
}

#action-menu-panel h1 {
  font-size: 1.25rem;
  font-weight: 800;
  letter-spacing: -0.02em;
  line-height: 1.2;
}

#action-menu-panel p.tagline {
  padding-bottom: 0.6rem;
  border-bottom: 1px solid var(--border);
  color: var(--text-muted);
  font-size: 0.85rem;
  line-height: 1.5;
}

#action-menu-panel #motivation-btn,
#action-menu-panel #goal-index-btn,
#action-menu-panel #course-info-btn,
#action-menu-panel #help-btn,
#action-menu-panel #download-btn {
  font-size: 0.82rem;
  font-weight: 600;
  letter-spacing: 0.01em;
  padding: 0.55rem 0.9rem;
  border-radius: var(--radius-pill);
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text);
  cursor: pointer;
  width: 100%;
  text-align: left;
  white-space: normal;
  transition: background 0.15s ease, border-color 0.15s ease;
}

#action-menu-panel #motivation-btn:hover,
#action-menu-panel #goal-index-btn:hover,
#action-menu-panel #course-info-btn:hover,
#action-menu-panel #help-btn:hover,
#action-menu-panel #download-btn:hover {
  border-color: var(--border-strong);
  background: var(--surface-hover);
}

/* Enkeltfil-utgaven tar et par sekunder å sette sammen. Knappen sier det
   med teksten sin; dette er bare for at den ikke skal se trykkbar ut imens. */
#action-menu-panel #download-btn[disabled] {
  opacity: 0.6;
  cursor: progress;
}

.progress-row {
  display: flex;
  align-items: center;
  gap: 0.9rem;
  padding-bottom: 0.6rem;
  border-bottom: 1px solid var(--border);
}

.progress-bar {
  flex: 1;
  max-width: 420px;
  height: 8px;
  background: var(--border);
  border-radius: 4px;
  overflow: hidden;
}

.progress-bar-fill {
  height: 100%;
  background: var(--accent-grad);
  width: 0%;
  transition: width 0.3s ease;
}

.progress-label {
  font-size: 0.82rem;
  color: var(--text-muted);
  white-space: nowrap;
}

#error-banner {
  display: none;
  background: var(--danger-tint);
  border-bottom: 1px solid var(--danger);
  color: var(--danger-soft);
  font-size: 0.85rem;
  padding: 0.8rem 2rem;
  white-space: pre-wrap;
}

#error-banner.visible { display: block; }

/* Øverste linje: fagnavnet, og veien videre for den som vil lage sitt eget.
   Den ligger i flex-kolonnen FØR <main>, så grafen mister nøyaktig høyden
   linja tar og ingenting legger seg oppå noe annet. Venstremargen er den
   samme som #graph-scroll har, slik at teksten står rett over den første
   kolonneoverskriften. Størrelsen er kolonneoverskriftens, men uten
   versalene og sperringen: dette er en setning, ikke en etikett. */
.made-with {
  flex: 0 0 auto;
  margin: 0;
  /* line-height: 1 fjerner den halve linjeavstanden som ellers ligger under
     teksten. De 5px ned til første emneoverskrift lages IKKE her: se
     #graph-container, som trekker lerretet opp inne i rullefeltet i
     stedet. Linja skal beholde hele sin egen høyde, ellers rulles grafen
     opp i teksten. */
  padding: 0.5rem 2rem 0;
  font-size: 0.7rem;
  line-height: 1;
  color: var(--text-muted);
}

/* Fagnavnet er det eneste som skal stikke seg ut: det sier hvilket tre dette
   er. Resten av linja er en invitasjon, og den kan ligge stille. */
.made-with strong {
  font-weight: 600;
  color: var(--text);
}

.made-with a {
  color: var(--accent);
  text-decoration: none;
  border-bottom: 1px solid transparent;
}

.made-with a:hover,
.made-with a:focus-visible {
  border-bottom-color: var(--accent);
}

main {
  flex: 1;
  display: flex;
  min-height: 0;
  width: 100%;
}

#graph-scroll {
  flex: 1;
  min-width: 0;
  overflow: auto;
  /* Ingen padding-top: over grafen står .made-with, som holder den klar av
     skjermkanten, og avstanden derfra ned til første kolonneoverskrift er
     LAYOUT.padding i selve layout-algoritmen (se
     computeGlobalRowStarts/layoutColumn). To luftrom oppå hverandre ble
     synlig for mye. */
  padding: 0 2rem 2.4rem;
  position: relative;
  cursor: grab;
}

#graph-scroll.panning {
  cursor: grabbing;
  user-select: none;
}

/* margin-top: 5px ned til første emneoverskrift, og regnestykket er dette:
   lerretet har 12px egen luft (LAYOUT.padding) som gjelder alle fire sidene
   og ikke skal krympes for å rette én av dem, så lerretet trekkes 7px opp
   INNE i rullefeltet. De 7px lå til 21.09 som negativ bunnmarg på
   .made-with, og det var feil sted: da startet #graph-scroll 7px inne i
   toppteksten, og nodekortene rullet opp over de nederste 7px av bokstavene
   i stedet for å stoppe under dem. Her er det bare tomrommet øverst i
   lerretet som beskjæres, og teksten står i fred. */
#graph-container {
  position: relative;
  margin: -7px auto 0;
  transform-origin: 0 0;
}

/* Flytende verktøylinje for zoom - eneste innhold igjen i bottom-toolbar
   etter at "vis alle læringsmål" og prøvegeneratoren flyttet inn i
   #action-menu-panel (se ensureActionMenu i engine.js). Disse knappene
   brukes aktivt mens man utforsker kartet, så de forblir synlige i stedet
   for gjemt bak et trekkspill. */
#bottom-toolbar {
  position: fixed;
  left: 1.6rem;
  bottom: 1.6rem;
  z-index: 15;
  display: flex;
  align-items: center;
  gap: 0.7rem;
}

#zoom-controls {
  display: flex;
  align-items: stretch;

/* --------------------------------------------------------------------------
   Aid tag.

   Replaces the old .badge-del1/.badge-del2/.badge-begge trio, which hardcoded
   a two-level Norwegian exam split into CSS class names. Levels are now open
   ended: the colour comes from --aid-N in tokens.css, chosen by LEVEL, and is
   set inline by makeAidsTag() in engine.js — that is the one place a `style`
   attribute is legitimate here, because the level count is data.

   A tag ALWAYS carries its label in words ("Del 1", "Del 1+2"). The --aid-*
   colours separate by hue rather than luminance, so the text is what carries
   the meaning; a wordless tag would be colour-only. See tokens.css.

   It is a <button>: clicking it opens the detail panel at the aids section,
   which is the only place a student can read what the level actually allows.
   -------------------------------------------------------------------------- */

.aidtag {
  display: inline-flex;
  align-items: center;
  padding: 0.1rem 0.45rem;
  border: 0;
  border-radius: 0;
  color: var(--surface);
  font-family: inherit;
  font-size: 0.68rem;
  font-weight: 600;
  letter-spacing: 0.02em;
  line-height: 1.5;
  white-space: nowrap;
  cursor: pointer;
}
.aidtag:hover { filter: brightness(1.12); }
.aidtag:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

/* A split tag is the same size as a single one — that is the whole point of
   splitting rather than stacking two tags. The text sits on top of both
   stripes, so it needs a shadow to stay readable across the seam. */
.aidtag--split { text-shadow: 0 0 2px rgba(26, 29, 27, 0.55); }

/* In the detail panel the tag is a label, not a control. */
.aidtag--static { cursor: default; }
.aidtag--static:hover { filter: none; }



.badge-type {
  font-size: 0.68rem;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  font-weight: 600;
}

  transition: text-decoration-color 0.15s;
}

.prereq-link:hover,
.prereq-link:focus-visible {
  text-decoration-color: currentColor;
}

.instruction-actions {
  display: flex;
  gap: 0.6rem;
  margin-bottom: 0.8rem;
}

.btn {
  font-size: 0.82rem;
  font-weight: 600;
  padding: 0.5rem 0.95rem;
  border-radius: var(--radius-pill);
  border: none;
  background: var(--accent-grad);
  color: var(--ink-inverse);
  cursor: pointer;
  transition: transform 0.15s ease, opacity 0.15s ease;
}

.btn.secondary {
  background: transparent;
  color: var(--text);
  border: 1px solid var(--border);
}

.btn:hover { transform: translateY(-1px); opacity: 0.92; }
.btn.secondary:hover { border-color: var(--border-strong); background: var(--surface-hover); transform: none; opacity: 1; }

#instruction-text {
  display: none;
  width: 100%;
  min-height: 220px;
  font-family: ui-monospace, 'SFMono-Regular', Consolas, monospace;
  font-size: 0.78rem;
  line-height: 1.55;
  padding: 0.8rem;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--bg);
  color: var(--text);
  resize: vertical;
  margin-bottom: 1.4rem;
}

#instruction-text.visible { display: block; }

.exam-list {
  list-style: none;
  font-size: 0.86rem;
}

.exam-list li {
  padding: 0.5rem 0;
  border-top: 1px solid var(--border);
}

.exam-list li:first-child { border-top: none; }

.exam-list a { text-decoration: none; }
.exam-list a:hover, .exam-list a:focus-visible { text-decoration: underline; }

#detail-empty {
  color: var(--text-muted);
  font-style: italic;
  padding: 2rem 0;
}

/* Legend */

/* Kortene selv skriver nå ut "Del 1"/"Del 2"/"Del 1+2" i sin egen badge
   (se makeHjelpemiddelBadge i engine.js) i stedet for forkortelsen "D1" -
   en egen forklarende legend er derfor overflødig. #legend-elementet står
   igjen tomt i hvert fags index.html; skjul det helt så det ikke tar opp
   plass. */
#legend {
  display: none;
}

@media (max-width: 720px) {
  #detail-panel.open { width: 100vw; position: fixed; inset: 0; z-index: 20; }
  #detail-panel-inner { width: 100vw; }
}

/* ==========================================================================
   SITE-SPECIFIC OVERRIDES — must stay last in the file.

   Everything above this line is the ported source, unchanged. Rules that
   aiskilltrees-style actually contradicts go here instead of being edited
   in place, so the two copies stay easy to diff.

   They have to be LAST: the rules they overrule have the same specificity,
   so only source order decides. Put this block at the top and it silently
   does nothing.
   ========================================================================== */

/* BUTTONS ARE ROUNDED IN THE TREE APP — a deliberate departure from
   aiskilltrees-style, decided by Vidar 2026-09-20.

   The port originally squared every text button to match the design system,
   which left #goal-index-btn and #exam-btn square while the icon controls
   next to them stayed pills — an inconsistency visible in the same menu.
   Rather than square the pills too, the whole app goes round.

   The rule is now: in the tree app, CONTROLS are pills and CONTAINERS
   (modals, panels, the node boxes) stay square, so --radius is still 0.
   The marketing pages are untouched and remain square throughout. */
.btn,
#action-menu-panel #goal-index-btn,
#action-menu-panel #exam-btn,
#lesson-plan-btn,
.linkbtn,
.column-header-btn {
  border-radius: var(--radius-pill);
}

/* Læringsmålnavnet i «Vis alle læringsmål» er en knapp (den hopper til noden
   i kartet), men skal lese som tekst. Se renderGoalIndexBody i engine.js. */
button.goal-index-item-name {
  border: 0;
  background: none;
  padding: 0;
  margin: 0;
  font: inherit;
  color: inherit;
  text-align: left;
  cursor: pointer;
}
button.goal-index-item-name:hover { color: var(--accent); text-decoration: underline; }
button.goal-index-item-name:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* THE APP FILLS THE VIEWPORT — <body> HAS TO BE THE FLEX COLUMN.

   `main` asks for `flex: 1; min-height: 0`, which only means something inside a
   flex container, and nothing ever made <body> one. So `main` took its content
   height instead: #graph-scroll grew to the full height of the graph (2600px+
   on a 900px screen), the WINDOW scrolled vertically, and the scroll container
   itself had no vertical range at all — scrollHeight === clientHeight.

   That is what made drag-to-pan work sideways and do nothing downwards.
   setupPanning() in engine.js sets scrollLeft AND scrollTop on every move; the
   horizontal one had somewhere to go and the vertical one did not. Same reason
   the mouse wheel scrolled the page rather than the map.

   Missing in the skogvoll.com original too, so this is a fix, not a port
   artefact to keep. `height: 100%` on html+body near the top of this file is
   what gives the column a definite height to divide up; `overflow: hidden`
   keeps a stray child from bringing the page scrollbar back. The detail panel
   scrolls itself (#detail-panel-inner is overflow-y: auto), so nothing inside
   depends on the page scrolling. */
body {
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* LEDETEKSTEN OVER BESKRIVELSEN — «Eleven kan:» / «Eleven kan forklare:».

   Beskrivelsen i tree.csv er fra 2026-09-21 en bar verbfrase (ferdighet)
   eller en bar definisjon (begrep); setningen fullføres her. Ledeteksten er
   derfor ikke pynt, den er halve setningen, og den står i primærgrønt på
   egen linje for å vise at den kommer fra verktøyet og ikke fra læreren som
   skrev noden. Se learnerLeadIn() i engine.js. */
#detail-lead {
  margin-bottom: 0.3rem;
  font-size: 0.95rem;
  font-weight: 600;
  color: var(--accent);
}

/* #detail-desc er et <div> fra samme dato, fordi en node kan holde flere
   definisjoner. Avsnittsmargen slås av her; avstanden ned til
   forutsetningene er elementets egen margin-bottom lenger opp i fila. */
#detail-desc > p { margin: 0; }

#detail-desc .definition-list {
  margin: 0;
  padding-left: 1.15rem;
}

#detail-desc .definition-list li { margin-bottom: 0.4rem; }
#detail-desc .definition-list li:last-child { margin-bottom: 0; }
/* Termen står i samme farge som brødteksten ellers, bare i halvfeit: den
   skal skille seg fra definisjonen, ikke fra siden. Gjelder både avsnittet
   med én definisjon og punktlista med flere. */
#detail-desc strong { color: var(--text); }


/* KANTENE ER SVAKE SOM STANDARD - tre nivåer, ikke ett.

   Et tre med hundre noder tegner flere hundre kurver, og i full styrke legger
   de seg som et garnnøste over kolonnene (Vidar, 2026-09-21). Grunnfargen er
   derfor lys nok til at strukturen anes uten å konkurrere med boksene, og to
   tilstander henter en kant tilbake:

     .edge-from-mastered  kanten GÅR FRA en node eleven har huket av. Det er
                          kantene som peker videre inn i det eleven kan ta fatt
                          på nå, så de er de eneste som er verdt å lese i en
                          graf man ikke har valgt noe i.
     .edge-selected       kanten hører til noden som er åpen i detaljpanelet,
                          inn eller ut. Denne er grønn - den svarer på «hva
                          henger sammen med DENNE?», som er et annet spørsmål
                          enn «hvor er jeg», og skal kunne følges på tvers av
                          hele kartet.

   Grønn er aldri det eneste signalet: den valgte noden har også .active, og en
   avhuket node har sin egen ring og avkryssede boks. Se updateEdgeHighlight()
   i engine.js, som også flytter de valgte kantene sist i <svg> så de tegnes
   øverst. Erstatter .edge-active, som lyste opp kanter der BEGGE endene var
   mestret - en tilstand eleven ikke har bruk for å se. */
#edges path {
  stroke: color-mix(in srgb, var(--ink) 15%, transparent);
  stroke-width: 1.3;
}

#edges path.edge-from-mastered {
  stroke: color-mix(in srgb, var(--ink) 40%, transparent);
  stroke-width: 1.7;
}

#edges path.edge-selected {
  stroke: color-mix(in srgb, var(--accent) 85%, transparent);
  stroke-width: 2.4;
}
</style>
