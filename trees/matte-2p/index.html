<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ferdighetstre — Matematikk 2P | AI Skill Trees</title>
  <meta name="description" content="Interaktivt ferdighetstre for matematikk 2P: huk av det du mestrer, og kopier en KI-instruks for å trene videre.">

  <!--
    Denne sida laster tokens.css og tree.css, og IKKE base.css/components.css.
    base.css har båndmodellen og prosa-standardene for innholdssidene, og de
    krangler med appens eget layout. tree.css har derfor sin egen lille reset
    øverst. Se kommentaren i toppen av tree.css.
  -->
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/tree.css">

  <!--
    Analytics, same place as on every other page: in <head>, right after the
    stylesheets. js/engine.js sends one `copy_instruction` event per copied
    instruction on top of the page view — see the "Analytics" block there for
    what is deliberately NOT measured.

    NO LANGUAGE SWITCH HERE, and no js/i18n.js: this tree is written in
    Norwegian by its author and is not a translatable view. The catalogue at
    /trees/ is what switches language, and it shows each tree's own language
    on its card. See AGENTS.md, "Språk".
  -->
  <script src="/js/analytics.js"></script>
</head>
<body>
  <!--
    engine.js tømmer denne <header>-en og flytter alt innholdet (tilbakelenke,
    fremdriftslinje, tittel, ingress) inn i den flytende menyen nede til
    venstre, slik at grafen får hele skjermhøyden. Se ensureActionMenu().
    Elementene må derfor ligge her, med akkurat disse klassene — men de vises
    aldri på denne plassen (tree.css skjuler `header` helt).
  -->
  <header>
    <div class="header-inner">
      <a class="back-link" href="/trees/">← alle ferdighetstrær</a>
      <h1>Ferdighetstre for Matematikk 2P</h1>
      <p class="tagline">Et kart over hvordan ferdigheter og begreper bygger på hverandre — huk av det du mestrer, og kopier en KI-instruks for å trene videre.</p>
      <div class="progress-row">
        <div class="progress-bar"><div class="progress-bar-fill" id="progress-fill"></div></div>
        <span class="progress-label" id="progress-label">0 av 0 ferdigheter fullført</span>
      </div>
    </div>
  </header>

  <div id="error-banner"></div>
  <div id="legend"></div>

  <main>
    <div id="graph-scroll">
      <div id="graph-container">
        <div id="column-bands"></div>
        <svg id="edges"></svg>
        <div id="column-headers"></div>
        <div id="nodes-layer"></div>
      </div>
    </div>

    <aside id="detail-panel">
      <div id="detail-panel-inner">
        <p id="detail-empty">Klikk på en node i kartet for å se detaljer.</p>
      </div>
    </aside>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <script src="config.js"></script>
  <script src="/js/engine.js"></script>
</body>
</html>
