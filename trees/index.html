      static markup holds the ENGLISH string, because English is the default
      and that way the common case never flashes a wrong language.
    - Keys used by js/catalog.js, which builds the facet list, the cards and
      the result count in script and looks them up with window.i18n.t().
      FACETS / SORTS in that file name the keys; the strings are only here.

    NOTE ON FACET *VALUES*. The labels ("Country", "Level") translate; the
    values under them ("Norge", "Videregående", "Matematikk") do not. They
    come from each tree's own tree.csv (via catalog.json) and are data about that tree, not UI
    — a new value appears the moment a tree uses it, with no code change, and
    a lookup table here would silently go stale the first time someone
    contributes a tree in a language we did not anticipate. Same reason the
    trees themselves are not translated. See AGENTS.md, "Språk".

</head>
<body>

  <header class="siteheader" data-site-header></header>

  <main>

    <!-- Title band -->
    <section class="band">
      <div class="band__inner">
        <p class="eyebrow" data-i18n="page-eyebrow">Trees</p>
        <h1 data-i18n="page-heading">Find a skill tree</h1>
        <div class="prose">
          <p data-i18n="page-intro">
            Each tree maps one subject: what a student needs to be able to do, and what
            each thing builds on. Open a tree to tick off what you have mastered and copy
            the AI instruction for a given skill.
          </p>
        </div>
      </div>
    </section>

    <!-- Search + sort, as its own control strip -->
    <section class="band band--tight band--alt" aria-label="Search" data-i18n-attr="aria-label:search-region-label">
      <div class="band__inner">
        <div class="searchbar">
          <div class="searchbar__field">
            <label class="field-label" for="search" data-i18n="search-label">Search</label>
            <input class="input" type="search" id="search" autocomplete="off"
                   placeholder="Subject, level, topic or keyword — e.g. “2P”, “statistics”, “growth factor”"
                   data-i18n-attr="placeholder:search-placeholder">
          </div>
          <div class="searchbar__field searchbar__field--choice">
            <span class="field-label" id="sort-label" data-i18n="sort-label">Sort by</span>
            <!-- Four choices, so buttons side by side rather than a dropdown
                 (ux-design rule 8). Built by catalog.js (buildSortOptions). -->
            <div class="segmented" id="sort" role="group" aria-labelledby="sort-label"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- Filters + results -->
    <section class="band band--snug">
      <div class="band__inner">
        <div class="catalog">

          <!-- The filter list. Its contents are built by catalog.js from the
               metadata files, not by the markup here — see FACETS in
               js/catalog.js, and the facet-* keys in the dictionary above. -->
          <form class="filters" id="filters" data-collapsed="true" onsubmit="return false;">
            <button class="filters__toggle" type="button" id="filters-toggle" aria-expanded="false" aria-controls="filters-body">
              <span data-i18n="filters-heading">Filters</span>
              <span aria-hidden="true">▾</span>
            </button>

            <div class="filters__body" id="filters-body">
              <div class="filters__head">
                <h2 data-i18n="filters-heading">Filters</h2>
              </div>
              <div id="facet-list"></div>
            </div>
          </form>

          <div class="results">
            <div class="results__head">
              <p class="results__count" id="result-count" role="status" aria-live="polite"></p>
              <button class="linkbtn" type="button" id="reset" hidden data-i18n="reset-all">Clear all filters</button>
            </div>

            <div class="chips" id="chips"></div>

            <p class="loading" id="load-status" data-i18n="loading">Loading skill trees …</p>

            <ul class="treegrid" id="treegrid"></ul>

            <!-- Built by catalog.js (renderPager); hidden when everything fits on one page. -->
            <nav class="pager" id="pager" hidden aria-label="Pages" data-i18n-attr="aria-label:pager-label"></nav>
          </div>

        </div>
      </div>
    </section>

  </main>

  <footer class="band band--dark sitefooter" data-site-footer></footer>

  <script src="/js/catalog.js" defer></script>
</body>
</html>
