<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!--
    ===================================================================
    DENNE FILA ER IDENTISK FOR HVERT ENESTE FERDIGHETSTRE.
    Ikke skriv fagnavn, språk eller tekst inn her. Skal du legge til et
    tre, kopier fila som den er og la den være i fred; alt som skiller
    ett tre fra et annet ligger i tree.json ved siden av.

    Tittel, <h1>, ingress, tilbakelenke og <html lang> settes av
    applyPageChrome() i /engine/engine.js, fra tree.json + språkfila. Det er
    derfor teksten under er tomme plassholdere og ikke norsk: står det
    norsk her, blinker det norsk på et svensk tre før scriptet rekker å
    kjøre.

    Sida laster motorens egne tokens, sidas tokens (som overstyrer dem) og
    tree.css - og IKKE base.css/components.css.
    base.css har båndmodellen og prosastandardene for innholdssidene, og
    de krangler med appens eget layout. tree.css har derfor sin egen
    lille reset øverst.

    INGEN SPRÅKVEKSLER HER, med vilje: et ferdighetstre er skrevet på ett
    språk av den som laget det. Katalogen på /trees/ er det som veksler.
    ===================================================================
  -->
  <title>AI Skill Trees</title>
  <meta name="description" content="">

  <link rel="stylesheet" href="/engine/tokens.css">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/engine/tree.css">

  <script src="/js/analytics.js"></script>
</head>
<body>
  <!--
    engine.js tømmer denne <header>-en og flytter alt innholdet (tilbakelenke,
    fremdriftslinje, tittel, ingress) inn i den flytende menyen nede til
    venstre, slik at grafen får hele skjermhøyden. Se ensureActionMenu().
    Elementene må derfor ligge her, med akkurat disse klassene — men de vises
    aldri på denne plassen (tree.css skjuler `header` helt).
  -->
  <header>
    <div class="header-inner">
      <a class="back-link" href="/trees/"></a>
      <h1></h1>
      <p class="tagline"></p>
      <div class="progress-row">
        <div class="progress-bar"><div class="progress-bar-fill" id="progress-fill"></div></div>
        <span class="progress-label" id="progress-label"></span>
      </div>
    </div>
  </header>

  <div id="error-banner"></div>
  <div id="legend"></div>

  <main>
    <div id="graph-scroll">
      <div id="graph-container">
        <div id="column-bands"></div>
        <svg id="edges"></svg>
        <div id="column-headers"></div>
        <div id="nodes-layer"></div>
      </div>
    </div>

    <aside id="detail-panel">
      <div id="detail-panel-inner">
        <p id="detail-empty"></p>
      </div>
    </aside>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <script src="/engine/engine.js"></script>
</body>
</html>
