<!DOCTYPE html>
<html lang="en">
<!--
  /how-it-works/ — omvisningen fra forsidas «See how it works».
  Dette er motorens tre-side (engine/index.html i ai-skill-trees) med
  demotreet og tour.js/tour.css lagt til. Se how-it-works_private/AGENTS.md.
-->
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>AI Skill Trees</title>
  <meta name="description" content="">

  <link rel="stylesheet" href="/assets/engine/tokens.css">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/assets/engine/tree.css">
  <link rel="stylesheet" href="/how-it-works/tour.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script src="/js/analytics.js"></script>
  <!-- Velger demotreet på leserens språk og legger omvisningen oppå. Må
       lastes FØR engine.js: den skriver om hvor tree.csv hentes fra. -->
  <script src="/how-it-works/tour.js"></script>

</head>
<body>
  <!--
    engine.js tømmer denne <header>-en og flytter alt innholdet (tilbakelenke,
    fremdriftslinje, tittel, ingress) inn i den flytende menyen nede til
    venstre, slik at grafen får hele skjermhøyden. Se ensureActionMenu().
    Elementene må derfor ligge her, med akkurat disse klassene — men de vises
    aldri på denne plassen (tree.css skjuler `header` helt).
  -->
  <header>
    <div class="header-inner">
      <a class="back-link" href="/"></a>
      <h1></h1>
      <p class="tagline"></p>
      <div class="progress-row">
        <div class="progress-bar"><div class="progress-bar-fill" id="progress-fill"></div></div>
        <span class="progress-label" id="progress-label"></span>
      </div>
    </div>
  </header>

  <!--
    Øverste linje på sida: fagnavnet, og en vei videre for den som ser et
    tre og lurer på om hen kan lage et selv. Den står HER framfor i den
    flytende menyen fordi den også skal stå i enkeltfil-utgaven en lærer
    laster ned og sender rundt — der er den den eneste lenka tilbake til
    metoden. Teksten fylles av applyPageChrome() fra språkfila.
  -->
  <p class="made-with" id="made-with"></p>

  <div id="error-banner"></div>
  <div id="legend"></div>

  <main>
    <div id="graph-scroll">
      <div id="graph-container">
        <div id="column-bands"></div>
        <svg id="edges"></svg>
        <div id="column-headers"></div>
        <div id="nodes-layer"></div>
      </div>
    </div>

    <aside id="detail-panel">
      <div id="detail-panel-inner">
        <p id="detail-empty"></p>
      </div>
    </aside>
  </main>

  <!--
    PapaParse ligger LOKALT, ikke på et CDN (endret 2026-09-20). To grunner,
    og den første er avgjørende: en nedlastet enkeltfil-utgave av et tre må
    virke uten nett, og da kan ingen del av motoren ligge på en annen
    maskin. Den andre er at sida da ikke gjør et tredjepartskall for å
    tegne et ferdighetstre. MIT-lisensen står i fila.
  -->
  <script src="/assets/engine/vendor/papaparse.min.js"></script>
  <script src="/assets/engine/engine.js"></script>
</body>
</html>
